<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>熊本地震とイオンモール熊本爆発｜判明していない20の論点</title>
<meta name="description" content="令和8年熊本地震とイオンモール熊本の爆発について、確定していることと判明していないことを分けて整理した動画収録用ビジュアルブリーフ。" />
<style>
/* ===========================================================
   熊本地震 / イオンモール熊本 爆発 ビジュアルブリーフ
   16:9 動画収録用デッキ (1920x1080 基準)

   レイアウト規約
   - 画面右下は「ワイプ枠」として常時確保する。
     ここには一切コンテンツを置かない (--safe-r / --stage-clear で退避)。
   - 全ページに ambient(常時アニメーション) レイヤーを敷く。
   - 全ページに「イメージ」ボタンを置く。
   =========================================================== */

:root{
  --bg:#07090d;
  --panel:#111722;
  --text:#f5f7fb;
  --muted:#b8c0cd;

  --red:#ff3b3b;
  --amber:#ffb020;
  --cyan:#4fd7ff;
  --green:#6ee7a8;
  --violet:#c39cff;
  --line:rgba(255,255,255,.16);

  /* --- ワイプ枠 (右下)。16:9 を維持する --- */
  --wipe-w:21vw;
  --wipe-h:11.8125vw;      /* 21vw * 9/16 */
  --wipe-r:2.6vw;
  --wipe-b:2.4vh;

  /* 右下ワイプを避けるための安全マージン */
  --safe-r:calc(var(--wipe-w) + var(--wipe-r) + 1.6vw);
  /* 画面下部の操作UI帯(イメージボタン・ナビ)のぶん、本文が空ける高さ */
  --ui-band:9.2vh;
  /* stage(本文領域)の右カラムが下方向に空けるべき高さ
     = ワイプ上端 - stage 下端。stage 下端 = --ui-band + フッター高(約2.6vh) */
  --stage-clear:calc(var(--wipe-h) + var(--wipe-b) - var(--ui-band) - 2.6vh);
  /* モーダルにはフッターが無いぶん、余分に空ける必要がある */
  --modal-clear:calc(var(--wipe-h) + var(--wipe-b) - var(--ui-band) + 1vh);

  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html,body{
  margin:0;background:#000;color:var(--text);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  overflow:hidden;
}

/* ========================= デッキ / スライド ========================= */
#deck{width:100vw;height:100vh;position:relative;background:#000;overflow:hidden}

.slide{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg)}
.slide.active{display:block}
.slide.active .content{animation:slideIn .42s var(--ease) both}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.slide.active.back .content{animation-name:slideInBack}
@keyframes slideInBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* 背景写真 */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:brightness(.40) saturate(.80);transform:scale(1.03);
    animation:bgDrift 26s ease-in-out infinite alternate}
@keyframes bgDrift{from{transform:scale(1.03) translate3d(0,0,0)}to{transform:scale(1.09) translate3d(-1.2%,-1%,0)}}
.bg::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(2,4,8,.95) 0%,rgba(2,4,8,.74) 46%,rgba(2,4,8,.30) 100%),
    linear-gradient(0deg,rgba(2,4,8,.86),transparent 46%)}

/* ========================= ambient (常時アニメ) ========================= */
/* 全ページに必ず敷かれる、止まらない参考イラストのレイヤー */
.ambient{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.ambient .amb-art{
  position:absolute;right:-4%;top:50%;transform:translateY(-50%);
  width:70%;height:96%;opacity:.30;
  filter:drop-shadow(0 0 26px rgba(79,215,255,.18));
}
.ambient .amb-art svg{width:100%;height:100%;display:block}

/* 常時流れる地震計ストリップ (全ページ共通・必ず動く) */
.seismo{position:absolute;left:0;right:0;top:0;height:8vh;opacity:.5;pointer-events:none;z-index:1}
.seismo svg{width:200%;height:100%;display:block;animation:seismoScroll 9s linear infinite}
@keyframes seismoScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.seismo .line{fill:none;stroke:var(--cyan);stroke-width:2;opacity:.55}

/* ========================= コンテンツ ========================= */
.content{position:relative;z-index:2;width:100%;height:100%;
  padding:4.8vh 4.8vw var(--ui-band);display:flex;flex-direction:column;gap:1.4vh}

.kicker{font-size:clamp(15px,1.3vw,27px);font-weight:900;letter-spacing:.08em;
  color:var(--amber);display:flex;align-items:center;gap:.7em}
.kicker .dot{width:.6em;height:.6em;border-radius:50%;background:var(--amber);
  animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.75)}}

h1{font-size:clamp(40px,5.4vw,104px);line-height:1.05;margin:0;font-weight:1000;
  letter-spacing:-.045em;max-width:74%}
h2{font-size:clamp(30px,3.8vw,70px);line-height:1.12;margin:0;font-weight:1000;
  max-width:76%;letter-spacing:-.03em}
h3{font-size:clamp(19px,1.75vw,33px);margin:0 0 .5em;font-weight:900}
.lead{font-size:clamp(19px,1.9vw,36px);line-height:1.45;max-width:68%;
  font-weight:700;color:#e9edf4;margin:0}

/* 見出し内の強調 */
.hl-red{color:var(--red)}
.hl-amber{color:var(--amber)}
.hl-cyan{color:var(--cyan)}

/* stage = 本文領域。ここが flex:1 で伸びる */
.stage{flex:1;min-height:0;display:grid}

/* split: 必ず1行2列。行を minmax(0,1fr) にして高さを「確定」させる。
   ここを auto のままにすると、子の max-height:% が解決されず
   （％高さは不確定な包含ブロックに対しては無視される）右下ワイプに被る。 */
.stage.split{grid-template-columns:1.04fr .96fr;grid-template-rows:minmax(0,1fr);
  column-gap:2.4vw;align-items:stretch}
.stage.split > *{min-height:0;display:flex;flex-direction:column;gap:1.6vh}
/* 右下ワイプ退避: 右カラムは下端を空ける */
.stage.split > *:last-child{max-height:calc(100% - var(--stage-clear));overflow:hidden}
/* 右カラムの写真は、はみ出さないよう高さを抑える */
.stage.split > *:last-child .photo-card,
.stage.split > *:last-child .photo-slot{flex:0 1 auto;min-height:0;max-height:30vh}

/* full: 上詰めで積む。下端はワイプぶん常に空ける */
.stage.full{grid-template-columns:1fr;align-content:start;row-gap:1.8vh;
  padding-bottom:var(--stage-clear)}
.stage.full.guard-right > *:last-child{padding-right:var(--safe-r)}

/* 背景の動くイラストが薄く透けるよう、パネルは少しだけ透過させる */
.panel{background:rgba(13,18,27,.78);border:1px solid var(--line);border-radius:20px;
  padding:1.9vw;backdrop-filter:blur(9px);box-shadow:0 20px 54px rgba(0,0,0,.42)}

ul{margin:.35em 0 0;padding-left:1.2em}
li{font-size:clamp(17px,1.65vw,32px);line-height:1.42;margin:.45em 0;font-weight:750}
.small li{font-size:clamp(15px,1.35vw,25px);margin:.38em 0}
.tiny li{font-size:clamp(13px,1.15vw,21px);margin:.3em 0;font-weight:700}

/* 情報タグ: 出所の確度を色で分ける */
.tag{display:inline-block;padding:.32em .72em;border-radius:999px;
  font-size:clamp(12px,1vw,19px);font-weight:900;margin:0 .5em .5em 0;white-space:nowrap}
.confirmed{background:rgba(110,231,168,.18);border:1px solid var(--green);color:var(--green)}
.unknown  {background:rgba(255,176,32,.18);border:1px solid var(--amber);color:var(--amber)}
.hypo     {background:rgba(79,215,255,.16);border:1px solid var(--cyan);color:var(--cyan)}
.danger   {background:rgba(255,59,59,.16);border:1px solid var(--red);color:#ff8585}
/* 一般知識 = 今回の事故の取材情報ではなく、教科書的な背景知識 */
.knowledge{background:rgba(195,156,255,.16);border:1px solid var(--violet);color:var(--violet)}

.big-number{font-size:clamp(80px,12.5vw,232px);font-weight:1000;line-height:.8;
  color:var(--red);letter-spacing:-.08em}
.caption{font-size:clamp(14px,1.15vw,22px);color:var(--muted);line-height:1.45;margin:.8em 0 0}
.quote{font-size:clamp(23px,2.8vw,52px);line-height:1.35;font-weight:950;
  border-left:9px solid var(--red);padding-left:1em;max-width:80%}

/* データ行 (数値の追加情報) */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9vw,1fr));gap:1vw;margin-top:1.2vh}
.fact{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:1vw 1.1vw}
.fact b{display:block;font-size:clamp(20px,2vw,40px);line-height:1;color:var(--cyan);font-weight:1000}
.fact span{display:block;font-size:clamp(12px,1vw,19px);color:var(--muted);margin-top:.45em;line-height:1.3}

.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
.time{padding:1.3vw;border-top:5px solid var(--amber);background:rgba(255,255,255,.07);
  border-radius:0 0 14px 14px}
.time b{display:block;font-size:clamp(22px,2.1vw,42px);color:var(--amber);font-weight:1000}
.time span{font-size:clamp(14px,1.25vw,23px);line-height:1.35;display:block;margin-top:.4em}

.warning{padding:.9em 1.1em;border:2px solid var(--amber);background:rgba(255,176,32,.09);
  font-size:clamp(16px,1.35vw,26px);font-weight:850;line-height:1.45;border-radius:15px}
.note{padding:.85em 1.05em;border-left:5px solid var(--violet);background:rgba(195,156,255,.08);
  font-size:clamp(14px,1.2vw,23px);font-weight:700;line-height:1.5;border-radius:0 12px 12px 0}

/* 写真カード */
.photo-card{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:#111;aspect-ratio:16/10}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block;
  animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.13) translate(-1.5%,-1%)}}
.photo-card .label{position:absolute;left:0;right:0;bottom:0;padding:.9em 1em;
  background:linear-gradient(transparent,rgba(0,0,0,.92));
  font-size:clamp(12px,.95vw,19px);line-height:1.4}
.photo-card .label b{display:block;font-weight:900;margin-bottom:.2em}
.photo-card .label .credit{color:#98a2b1;font-size:.86em;display:block;margin-top:.25em}
/* 「今回の現場ではない」参考写真であることを常に明示するバッジ */
.photo-card .badge{position:absolute;left:.7em;top:.7em;z-index:2;
  padding:.34em .7em;border-radius:8px;font-size:clamp(11px,.85vw,17px);font-weight:900;
  background:rgba(0,0,0,.72);border:1px solid currentColor;backdrop-filter:blur(4px)}
.badge.ref{color:var(--amber)}      /* 参考写真 (別事案・別災害) */
.badge.site{color:var(--green)}     /* 当該施設の平時写真 */
.badge.slot{color:var(--cyan)}      /* 差し替え用スロット */

/* 実写差し替えスロット */
.photo-slot{display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:.6em;text-align:center;border:2px dashed rgba(79,215,255,.45);border-radius:18px;
  background:repeating-linear-gradient(45deg,rgba(79,215,255,.05) 0 12px,transparent 12px 24px);
  aspect-ratio:16/10;padding:1.2em;color:var(--muted);font-size:clamp(12px,1vw,20px);line-height:1.5}
.photo-slot b{color:var(--cyan);font-size:1.15em;font-weight:900}
.photo-slot code{background:rgba(0,0,0,.5);padding:.15em .5em;border-radius:6px;
  font-size:.92em;color:#e9edf4}

/* ========================= ヘッダー / フッター ========================= */
.brand{position:absolute;right:var(--wipe-r);top:3.2vh;z-index:3;text-align:right;
  pointer-events:none}
.brand .name{font-weight:1000;letter-spacing:.1em;color:rgba(255,255,255,.55);
  font-size:clamp(11px,.95vw,17px)}
.brand .pageno{font-weight:1000;font-size:clamp(20px,2.2vw,42px);line-height:1;margin-top:.15em;
  color:#fff;letter-spacing:-.03em}
.brand .pageno small{color:rgba(255,255,255,.45);font-size:.5em;font-weight:900}

.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
  gap:1.6vw;color:#aeb6c4;font-size:clamp(11px,.85vw,16px);
  padding-right:var(--safe-r)}       /* ワイプ退避 */
.footer .source{line-height:1.4;max-width:100%}
.footer .source b{color:#d7dde6}

/* ========================= ワイプ枠 (右下) ========================= */
#wipe{position:fixed;z-index:60;right:var(--wipe-r);bottom:var(--wipe-b);
  width:var(--wipe-w);height:var(--wipe-h);border-radius:16px;pointer-events:none;
  border:2px solid rgba(255,255,255,.30);
  background:rgba(0,0,0,.42);
  box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;transition:opacity .25s}
#wipe .wipe-inner{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.5em;color:rgba(255,255,255,.42);
  font-size:clamp(11px,.9vw,17px);font-weight:900;letter-spacing:.06em;text-align:center}
#wipe .wipe-inner .mark{font-size:2.1em;line-height:1;opacity:.8}
#wipe .corner{position:absolute;width:16px;height:16px;border:3px solid var(--cyan);opacity:.85}
#wipe .corner.tl{left:7px;top:7px;border-right:0;border-bottom:0}
#wipe .corner.tr{right:7px;top:7px;border-left:0;border-bottom:0}
#wipe .corner.bl{left:7px;bottom:7px;border-right:0;border-top:0}
#wipe .corner.br{right:7px;bottom:7px;border-left:0;border-top:0}
/* 収録本番用: 枠線とガイドを消す (Wキー) */
#wipe.bare{border-color:transparent;background:transparent;box-shadow:none}
#wipe.bare .wipe-inner,#wipe.bare .corner{display:none}
/* クロマキー用ベタ塗り (Gキー) */
#wipe.chroma{background:#00b140;border-color:#00b140}
#wipe.chroma .wipe-inner,#wipe.chroma .corner{display:none}
/* 衝突チェック用ハイライト (Dキー) */
#wipe.debug{background:rgba(255,0,200,.34);border-color:#ff00c8}

/* ========================= 画面下の操作帯 ========================= */
/* イメージボタンとナビを1行に並べ、本文フッターの下に収める */
#bottomBar{position:fixed;z-index:50;left:4.8vw;bottom:2.6vh;
  display:flex;align-items:center;gap:14px}

/* ========================= イメージボタン ========================= */
#imgBtn{
  display:inline-flex;align-items:center;gap:.7em;cursor:pointer;
  padding:.72em 1.35em;border-radius:999px;border:2px solid var(--cyan);
  background:linear-gradient(135deg,rgba(79,215,255,.22),rgba(79,215,255,.08));
  color:#eaf9ff;font-weight:1000;font-size:clamp(14px,1.25vw,24px);letter-spacing:.06em;
  box-shadow:0 0 0 0 rgba(79,215,255,.42),0 12px 34px rgba(0,0,0,.5);
  animation:imgPulse 2.6s ease-out infinite;transition:transform .14s var(--ease),background .2s}
@keyframes imgPulse{
  0%{box-shadow:0 0 0 0 rgba(79,215,255,.42),0 12px 34px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 18px rgba(79,215,255,0),0 12px 34px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 0 rgba(79,215,255,0),0 12px 34px rgba(0,0,0,.5)}}
#imgBtn:hover{transform:translateY(-2px);background:linear-gradient(135deg,rgba(79,215,255,.34),rgba(79,215,255,.14))}
#imgBtn:active{transform:translateY(0) scale(.97)}
#imgBtn .ico{font-size:1.22em;line-height:1}
#imgBtn .hint{font-size:.66em;font-weight:800;opacity:.72;letter-spacing:.02em}
#imgBtn.open{border-color:var(--amber);color:#fff3dc;
  background:linear-gradient(135deg,rgba(255,176,32,.3),rgba(255,176,32,.1));animation:none}

/* ========================= イメージモーダル ========================= */
/* ワイプ(z:60)より下に敷き、右下は必ず空ける */
#imgModal{position:fixed;inset:0;z-index:40;display:none;
  background:rgba(3,5,9,.90);backdrop-filter:blur(14px)}
#imgModal.open{display:block;animation:modalIn .3s var(--ease) both}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
#imgModal .modal-wrap{position:absolute;inset:0;
  padding:4.4vh 4.8vw var(--ui-band);display:flex;flex-direction:column;gap:1.4vh}
#imgModal .modal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2vw;
  padding-right:var(--safe-r)}
#imgModal .modal-head h2{max-width:100%;font-size:clamp(26px,3.2vw,58px)}
#imgModal .modal-kicker{font-size:clamp(13px,1.15vw,23px);font-weight:900;color:var(--cyan);
  letter-spacing:.09em;margin-bottom:.35em}
/* stage.split と同じ理由で、行を minmax(0,1fr) にして高さを確定させる */
#imgModal .modal-body{flex:1;min-height:0;display:grid;
  grid-template-columns:1.15fr .85fr;grid-template-rows:minmax(0,1fr);
  column-gap:2.2vw;align-items:stretch}
#imgModal .modal-body > *{min-height:0}
#imgModal .modal-body > *:last-child{max-height:calc(100% - var(--modal-clear));overflow:hidden}
#imgModal .scene-side .photo-card,
#imgModal .scene-side .photo-slot{flex:0 1 auto;min-height:0;max-height:24vh}
#imgModal .modal-close{position:absolute;right:calc(var(--safe-r) - 1vw);top:3.4vh;z-index:3;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;border-radius:10px;
  padding:.5em .85em;font-weight:900;cursor:pointer;font-size:clamp(12px,1vw,19px)}
#imgModal .modal-close:hover{background:rgba(255,255,255,.14)}

/* モーダル内の大きい動くイラスト */
.scene-stage{position:relative;border-radius:22px;overflow:hidden;
  background:linear-gradient(150deg,#131a26,#070a10);border:1px solid var(--line);
  min-height:0;display:flex;align-items:center;justify-content:center}
.scene-stage svg{width:100%;height:100%;display:block}
.scene-stage .scene-cap{position:absolute;left:0;right:0;bottom:0;padding:1em 1.2em;
  background:linear-gradient(transparent,rgba(0,0,0,.92));
  font-size:clamp(12px,1vw,20px);color:var(--muted);line-height:1.45}
.scene-side{display:flex;flex-direction:column;gap:1.2vh;min-height:0;overflow:hidden}

/* ========================= コントロール ========================= */
#controls{display:flex;gap:8px;transition:opacity .3s}
#controls.idle{opacity:0}
#controls button{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:#fff;
  border-radius:10px;padding:.5em .8em;font-weight:900;cursor:pointer;
  font-size:clamp(11px,.95vw,18px);transition:background .18s}
#controls button:hover{background:rgba(255,255,255,.16)}
#controls button.off{opacity:.45}

#progress{position:fixed;z-index:55;left:0;bottom:0;height:4px;background:var(--red);
  transition:width .28s var(--ease);box-shadow:0 0 12px var(--red)}

/* 起動時のミュート解除案内 (ブラウザの自動再生制限対策) */
#audioNotice{position:fixed;z-index:70;left:50%;top:3.4vh;transform:translateX(-50%);
  padding:.6em 1.1em;border-radius:999px;border:1px solid var(--amber);
  background:rgba(255,176,32,.16);color:#ffe6b8;font-weight:900;
  font-size:clamp(12px,1vw,19px);backdrop-filter:blur(6px);transition:opacity .4s}
#audioNotice.hide{opacity:0;pointer-events:none}

/* ========================= 汎用アニメーション (scenes.js が使用) ========================= */
.an-pulse {animation:aPulse  var(--d,2.4s) ease-in-out var(--dl,0s) infinite}
.an-float {animation:aFloat  var(--d,4s)   ease-in-out var(--dl,0s) infinite alternate}
.an-rise  {animation:aRise   var(--d,3.4s) ease-in     var(--dl,0s) infinite}
.an-fall  {animation:aFall   var(--d,3s)   ease-in     var(--dl,0s) infinite}
.an-spin  {animation:aSpin   var(--d,9s)   linear      var(--dl,0s) infinite;transform-origin:var(--ox,50%) var(--oy,50%)}
.an-dash  {animation:aDash   var(--d,2.2s) linear      var(--dl,0s) infinite}
.an-shake {animation:aShake  var(--d,.5s)  ease-in-out var(--dl,0s) infinite}
.an-blink {animation:aBlink  var(--d,1.8s) ease-in-out var(--dl,0s) infinite}
.an-expand{animation:aExpand var(--d,3s)   ease-out    var(--dl,0s) infinite}
.an-drift {animation:aDrift  var(--d,7s)   linear      var(--dl,0s) infinite}
.an-scan  {animation:aScan   var(--d,4.5s) ease-in-out var(--dl,0s) infinite alternate}
.an-seq   {animation:aSeq    var(--d,6s)   ease-in-out var(--dl,0s) infinite}
.an-sweep {animation:aSweep  var(--d,5s)   linear      var(--dl,0s) infinite}

@keyframes aPulse {0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
@keyframes aFloat {from{transform:translateY(0)}to{transform:translateY(var(--ty,-14px))}}
@keyframes aRise  {0%{opacity:0;transform:translateY(0) scale(.6)}
                   18%{opacity:.95}
                   100%{opacity:0;transform:translateY(var(--ty,-90px)) scale(1.5)}}
@keyframes aFall  {0%{opacity:0;transform:translateY(var(--ty0,-40px)) rotate(0)}
                   14%{opacity:1}
                   100%{opacity:0;transform:translateY(var(--ty,120px)) rotate(var(--rot,180deg))}}
@keyframes aSpin  {to{transform:rotate(360deg)}}
@keyframes aDash  {to{stroke-dashoffset:var(--dof,-56)}}
@keyframes aShake {0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes aBlink {0%,100%{opacity:.18}50%{opacity:1}}
@keyframes aExpand{0%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(1.9)}}
@keyframes aDrift {0%{transform:translateX(0);opacity:0}
                   12%{opacity:.9}88%{opacity:.9}
                   100%{transform:translateX(var(--tx,150px));opacity:0}}
@keyframes aScan  {from{transform:translateX(var(--x0,-24px)) rotate(var(--r0,-20deg))}
                   to{transform:translateX(var(--x1,24px)) rotate(var(--r1,20deg))}}
@keyframes aSeq   {0%,100%{opacity:.16}
                   8%,20%{opacity:1}
                   30%{opacity:.16}}
@keyframes aSweep {from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}

/* SVG 共通 */
.sv-lbl{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:900;fill:#dfe6ef}
.sv-dim{fill:#8f9baa}
.sv-stroke{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ========================= レスポンシブ (確認用) ========================= */
@media(max-width:1100px){
  .stage.split{grid-template-columns:1fr}
  .stage.split > *:last-child{max-height:none}
  h1,h2,.lead{max-width:100%}
  .timeline{grid-template-columns:1fr 1fr}
  #imgModal .modal-body{grid-template-columns:1fr}
  :root{--wipe-w:32vw;--wipe-h:18vw}
}
@media(prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001s!important;animation-iteration-count:1!important}
}

</style>

<body>

<!-- スライド本体。中身は deck.js が SLIDES から組み立てる -->
<div id="deck"></div>

<!-- 右下ワイプスペース：ここに収録した自分のカメラ映像を後乗せする -->
<div id="wipe">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <div class="wipe-inner">
    <span class="mark">🎙</span>
    <span>WIPE / 話者</span>
  </div>
</div>

<!-- 参考イメージのオーバーレイ（中身は deck.js が生成） -->
<div id="imgModal" role="dialog" aria-modal="true" aria-label="参考イメージ"></div>

<!-- 画面下の操作帯。1行にまとめて、本文フッターと重ならないようにする -->
<div id="bottomBar">
  <!-- 全ページ共通の「イメージ」ボタン。押すとそのページの動く参考イラストが開く -->
  <button id="imgBtn" type="button" aria-label="このページの参考イメージを開く">
    <span class="ico">🖼</span>
    <span class="txt">イメージ</span>
    <span class="hint">I</span>
  </button>

  <div id="controls">
    <button id="btnPrev" type="button" title="前のページ（←）">◀</button>
    <button id="btnNext" type="button" title="次のページ（→ / Space）">▶</button>
    <button id="btnFull" type="button" title="全画面">全画面</button>
    <button id="btnWipe" type="button" title="ワイプ枠の表示を切り替え（W）">枠</button>
    <button id="btnMute" type="button" title="効果音のミュート（M）">🔊</button>
  </div>
</div>

<div id="progress"></div>

<div id="audioNotice">画面をクリックすると効果音が有効になります</div>

<script>
/* ===========================================================
   scenes.js — 動く参考イラスト(SVG)ライブラリ
   -----------------------------------------------------------
   各シーンは SCENES[key](big) で SVG 文字列を返す。
     big=false … ページ背景の ambient (常時アニメ・低不透明度・ラベルなし)
     big=true  … 「イメージ」ボタンで開く拡大表示 (ラベルつき)
   アニメーションは deck.css の .an-* クラスで付与する。

   図はすべて概念図であり、実際の現場の配置・寸法ではない。
   =========================================================== */
(function (global) {
  'use strict';

  var VB = '0 0 480 320';
  var C = { red:'#ff3b3b', amber:'#ffb020', cyan:'#4fd7ff', green:'#6ee7a8', violet:'#c39cff', dim:'#8f9baa' };

  /* 決定論的な擬似乱数 (毎回同じ絵になるように) */
  function rnd(seed) {
    var s = seed;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  function lbl(x, y, text, size, color) {
    if (size === undefined) size = 15;
    return '<text class="sv-lbl" x="' + x + '" y="' + y + '" font-size="' + size + '"' +
           (color ? ' fill="' + color + '"' : '') + '>' + text + '</text>';
  }
  /* big のときだけラベルを出す */
  function L(big) {
    return function (x, y, text, size, color) { return big ? lbl(x, y, text, size, color) : ''; };
  }

  /* 建物のシルエット (共通パーツ) */
  function mall(x, y, w, h, fill) {
    return '<g>' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="4" fill="' + (fill || '#1b2432') + '" stroke="#3a4658" stroke-width="2"/>' +
      '<rect x="' + (x + 6) + '" y="' + (y + 6) + '" width="' + (w - 12) + '" height="' + (h * 0.42) + '" fill="rgba(255,255,255,.05)"/>' +
      '<line x1="' + x + '" y1="' + (y + h * 0.55) + '" x2="' + (x + w) + '" y2="' + (y + h * 0.55) + '" stroke="#3a4658" stroke-width="1.5"/>' +
      '</g>';
  }
  function ground(y) {
    return '<line x1="10" y1="' + y + '" x2="470" y2="' + y + '" stroke="#3a4658" stroke-width="2"/>';
  }
  function wrap(inner) { return '<svg viewBox="' + VB + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>'; }

  var SCENES = {};

  /* 01 爆発 ------------------------------------------------------------ */
  SCENES.blast = function (big) {
    var t = L(big), r = rnd(7), s = '', i;
    for (i = 0; i < 4; i++) {
      s += '<circle cx="248" cy="150" r="34" fill="none" stroke="' + C.red + '" stroke-width="3" ' +
           'class="an-expand" style="--d:2.8s;--dl:' + (i * 0.7).toFixed(2) + 's"/>';
    }
    for (i = 0; i < 14; i++) {
      var a = r() * Math.PI * 2, d = 30 + r() * 26;
      s += '<rect x="' + (248 + Math.cos(a) * d).toFixed(1) + '" y="' + (150 + Math.sin(a) * d * 0.7).toFixed(1) + '" ' +
           'width="' + (4 + r() * 7).toFixed(1) + '" height="' + (3 + r() * 5).toFixed(1) + '" fill="' + C.amber + '" ' +
           'class="an-fall" style="--d:' + (2 + r() * 2).toFixed(2) + 's;--dl:' + (r() * 2.4).toFixed(2) + 's;--ty:' + (70 + r() * 70).toFixed(0) + 'px;--rot:' + (r() * 540).toFixed(0) + 'deg"/>';
    }
    return wrap(
      ground(258) + mall(60, 168, 360, 90) +
      '<circle cx="248" cy="150" r="26" fill="' + C.amber + '" class="an-pulse" style="--d:1.6s" opacity=".85"/>' +
      s +
      t(60, 292, '爆発起点・規模は未公表（概念図）', 14, C.dim)
    );
  };

  /* 02 ガス漏れ -------------------------------------------------------- */
  SCENES.gasleak = function (big) {
    var t = L(big), r = rnd(11), s = '', i;
    for (i = 0; i < 12; i++) {
      s += '<circle cx="' + (196 + r() * 74).toFixed(0) + '" cy="' + (196 + r() * 22).toFixed(0) + '" r="' + (4 + r() * 8).toFixed(1) + '" ' +
           'fill="' + C.amber + '" opacity=".55" class="an-rise" ' +
           'style="--d:' + (2.6 + r() * 2.4).toFixed(2) + 's;--dl:' + (r() * 3.2).toFixed(2) + 's;--ty:-' + (60 + r() * 80).toFixed(0) + 'px"/>';
    }
    return wrap(
      ground(258) +
      '<rect x="40" y="196" width="150" height="14" rx="7" fill="' + C.dim + '"/>' +
      '<rect x="182" y="150" width="14" height="60" rx="7" fill="' + C.dim + '"/>' +
      '<circle cx="192" cy="200" r="9" fill="' + C.red + '" class="an-blink" style="--d:1.2s"/>' + s +
      '<text x="300" y="120" font-size="70" font-weight="900" fill="' + C.amber + '" opacity=".30" class="an-pulse" style="--d:3.2s">?</text>' +
      t(40, 240, '漏出箇所＝未判明', 15, C.amber) +
      t(40, 292, 'ガス漏れは有力視。ただし公式な原因確定ではない', 14, C.dim)
    );
  };

  /* 03 地震 ------------------------------------------------------------ */
  SCENES.quake = function (big) {
    var t = L(big), s = '', i;
    for (i = 0; i < 5; i++) {
      s += '<ellipse cx="150" cy="212" rx="30" ry="14" fill="none" stroke="' + C.red + '" stroke-width="2.5" ' +
           'class="an-expand" style="--d:3.2s;--dl:' + (i * 0.64).toFixed(2) + 's"/>';
    }
    var w = 'M240 150';
    for (i = 0; i < 24; i++) {
      var amp = i > 5 && i < 15 ? 34 : 9;
      w += ' L' + (240 + i * 9.5).toFixed(0) + ' ' + (150 + (i % 2 ? -amp : amp) * (0.55 + (i % 3) * 0.22)).toFixed(0);
    }
    return wrap(
      ground(212) +
      '<g class="an-shake" style="--d:.42s">' + mall(58, 160, 150, 52) + '</g>' + s +
      '<circle cx="150" cy="212" r="7" fill="' + C.red + '"/>' +
      '<path d="' + w + '" stroke="' + C.cyan + '" stroke-width="2.5" ' +
      'stroke-dasharray="460" class="sv-stroke an-sweep" style="--len:460;--d:3.4s"/>' +
      t(240, 118, 'M7.1 / 最大震度7', 17, C.cyan) +
      t(240, 250, '横ずれ断層型・深さ約16km', 14, C.dim) +
      t(58, 292, '震源から地表へ、揺れが同心円状に伝わる（概念図）', 14, C.dim)
    );
  };

  /* 04 時間差 ---------------------------------------------------------- */
  SCENES.clock = function (big) {
    var t = L(big), r = rnd(23), s = '', i;
    for (i = 0; i < 10; i++) {
      s += '<circle cx="' + (300 + r() * 130).toFixed(0) + '" cy="' + (150 + r() * 80).toFixed(0) + '" r="' + (5 + r() * 9).toFixed(1) + '" ' +
           'fill="' + C.amber + '" opacity=".4" class="an-pulse" style="--d:' + (2 + r() * 2).toFixed(2) + 's;--dl:' + (r() * 2).toFixed(2) + 's"/>';
    }
    return wrap(
      '<circle cx="150" cy="160" r="82" fill="none" stroke="' + C.dim + '" stroke-width="3"/>' +
      '<circle cx="150" cy="160" r="6" fill="' + C.amber + '"/>' +
      '<line x1="150" y1="160" x2="150" y2="96" stroke="' + C.amber + '" stroke-width="5" stroke-linecap="round" ' +
      'class="an-spin" style="--d:4s;--ox:150px;--oy:160px"/>' +
      '<line x1="150" y1="160" x2="150" y2="112" stroke="#fff" stroke-width="3" stroke-linecap="round" ' +
      'class="an-spin" style="--d:24s;--ox:150px;--oy:160px"/>' +
      '<rect x="288" y="120" width="156" height="112" rx="6" fill="none" stroke="' + C.dim + '" stroke-width="2"/>' + s +
      '<rect x="290" y="200" width="152" height="30" fill="' + C.amber + '" opacity=".22" class="an-pulse" style="--d:3.6s"/>' +
      t(96, 268, '地震発生', 16, C.cyan) + t(300, 268, 'ガスが滞留', 16, C.amber) +
      t(150, 40, '約80〜90分', 22, C.amber) +
      t(96, 296, '時間差＝蓄積説と整合。ただし裏づけ鑑定は未了', 14, C.dim)
    );
  };

  /* 05 配管 ------------------------------------------------------------ */
  SCENES.pipes = function (big) {
    var t = L(big), i, s = '';
    var pts = [[110, 196], [222, 196], [222, 130], [340, 130]];
    for (i = 0; i < pts.length; i++) {
      s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="11" fill="none" stroke="' + C.red + '" stroke-width="3" ' +
           'class="an-blink" style="--d:2.4s;--dl:' + (i * 0.6).toFixed(2) + 's"/>' +
           '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="4" fill="' + C.red + '" ' +
           'class="an-blink" style="--d:2.4s;--dl:' + (i * 0.6).toFixed(2) + 's"/>';
    }
    return wrap(
      ground(258) +
      '<rect x="46" y="176" width="40" height="40" rx="5" fill="#1b2432" stroke="' + C.dim + '" stroke-width="2"/>' +
      '<path d="M86 196 H340 M222 196 V130 H400" class="sv-stroke" stroke="' + C.dim + '" stroke-width="12"/>' +
      '<path d="M86 196 H340 M222 196 V130 H400" class="sv-stroke an-dash" stroke="' + C.cyan + '" stroke-width="4" ' +
      'stroke-dasharray="14 22" style="--d:1.6s;--dof:-36"/>' + s +
      '<rect x="392" y="106" width="52" height="48" rx="5" fill="#1b2432" stroke="' + C.dim + '" stroke-width="2"/>' +
      t(40, 236, 'LPガス設備', 15) + t(330, 96, '厨房・飲食区画', 14) +
      t(40, 292, '赤＝漏出の候補地点。実際の配管経路・破断位置は未公表', 14, C.dim)
    );
  };

  /* 06 着火源 ---------------------------------------------------------- */
  SCENES.spark = function (big) {
    var t = L(big), r = rnd(31), s = '', i;
    for (i = 0; i < 14; i++) {
      s += '<circle cx="' + (70 + r() * 170).toFixed(0) + '" cy="' + (120 + r() * 110).toFixed(0) + '" r="' + (10 + r() * 22).toFixed(0) + '" ' +
           'fill="' + C.amber + '" opacity=".16" class="an-pulse" style="--d:' + (2.4 + r() * 2).toFixed(2) + 's;--dl:' + (r() * 2.4).toFixed(2) + 's"/>';
    }
    var srcs = [['配線', 330, 120], ['スイッチ', 330, 170], ['厨房機器', 330, 220], ['復電の火花', 330, 268]];
    for (i = 0; i < srcs.length; i++) {
      s += '<circle cx="' + srcs[i][1] + '" cy="' + (srcs[i][2] - 5) + '" r="9" fill="' + C.red + '" ' +
           'class="an-seq" style="--d:6s;--dl:' + (i * 1.5).toFixed(2) + 's"/>' +
           (big ? lbl(srcs[i][1] + 18, srcs[i][2], srcs[i][0], 15) : '');
    }
    return wrap(
      ground(288) + s +
      '<text x="150" y="185" font-size="54" fill="#fff" opacity=".9" class="an-blink" style="--d:1.4s" text-anchor="middle">⚡</text>' +
      t(60, 100, '可燃範囲まで蓄積？', 16, C.amber) +
      t(60, 312, 'いずれも候補であり、着火源は特定されていない', 14, C.dim)
    );
  };

  /* 07 感震遮断 (マイコンメーター) ------------------------------------- */
  SCENES.meter = function (big) {
    var t = L(big);
    return wrap(
      '<rect x="180" y="110" width="120" height="104" rx="10" fill="#1b2432" stroke="' + C.dim + '" stroke-width="2.5"/>' +
      '<circle cx="240" cy="146" r="17" fill="none" stroke="' + C.cyan + '" stroke-width="2.5"/>' +
      '<circle cx="240" cy="146" r="6" fill="' + C.cyan + '" class="an-shake" style="--d:.4s"/>' +
      '<rect x="204" y="176" width="72" height="20" rx="4" fill="#0b1017" stroke="' + C.dim + '"/>' +
      '<rect x="208" y="180" width="64" height="12" fill="' + C.red + '" opacity=".8" class="an-blink" style="--d:1.1s"/>' +
      '<path d="M40 162 H180" class="sv-stroke" stroke="' + C.dim + '" stroke-width="12"/>' +
      '<path d="M300 162 H440" class="sv-stroke" stroke="' + C.dim + '" stroke-width="12"/>' +
      '<path d="M40 162 H180" class="sv-stroke an-dash" stroke="' + C.amber + '" stroke-width="4" stroke-dasharray="12 18" style="--d:1.3s;--dof:-30"/>' +
      '<path d="M300 162 H440" class="sv-stroke an-dash" stroke="' + C.green + '" stroke-width="4" stroke-dasharray="12 18" style="--d:2.6s;--dof:-30" opacity=".35"/>' +
      '<line x1="300" y1="140" x2="300" y2="184" stroke="' + C.green + '" stroke-width="5" class="an-blink" style="--d:2.2s"/>' +
      t(40, 132, '上流＝供給側', 15, C.amber) + t(330, 132, '下流＝館内', 15, C.green) +
      t(196, 240, '感震遮断', 16, C.cyan) +
      t(40, 276, 'メーターが止められるのは下流のみ。', 14, C.dim) +
      t(40, 296, '上流側の配管破断はメーターでは止まらない（一般論）', 14, C.dim)
    );
  };

  /* 08 避難 ------------------------------------------------------------ */
  SCENES.people = function (big) {
    var t = L(big), r = rnd(41), s = '', i;
    for (i = 0; i < 9; i++) {
      s += '<circle cx="' + (120 + r() * 120).toFixed(0) + '" cy="' + (150 + r() * 70).toFixed(0) + '" r="6" fill="' + C.cyan + '" ' +
           'class="an-drift" style="--d:' + (4 + r() * 3).toFixed(2) + 's;--dl:' + (r() * 4).toFixed(2) + 's;--tx:' + (150 + r() * 60).toFixed(0) + 'px"/>';
    }
    for (i = 0; i < 3; i++) {
      s += '<circle cx="' + (150 + i * 34) + '" cy="' + (196 + (i % 2) * 22) + '" r="7" fill="' + C.amber + '" ' +
           'class="an-blink" style="--d:2s;--dl:' + (i * 0.5) + 's"/>';
    }
    return wrap(
      '<rect x="70" y="110" width="250" height="140" rx="8" fill="none" stroke="' + C.dim + '" stroke-width="2.5"/>' +
      '<rect x="316" y="160" width="8" height="42" fill="' + C.green + '"/>' + s +
      '<path d="M330 181 H420" class="sv-stroke" stroke="' + C.green + '" stroke-width="3" marker-end="url(#ar)"/>' +
      '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">' +
      '<path d="M0 0 L9 4.5 L0 9 z" fill="' + C.green + '"/></marker></defs>' +
      t(354, 168, '避難', 15, C.green) +
      t(80, 100, '館内', 15) + t(120, 282, '橙＝爆発時に残っていた人', 14, C.amber) +
      t(120, 302, '個別の行動理由は正式確認前', 14, C.dim)
    );
  };

  /* 09 救助 ------------------------------------------------------------ */
  SCENES.rescue = function (big) {
    var t = L(big), r = rnd(53), s = '', i;
    for (i = 0; i < 16; i++) {
      s += '<rect x="' + (70 + r() * 300).toFixed(0) + '" y="' + (196 + r() * 46).toFixed(0) + '" width="' + (10 + r() * 24).toFixed(0) + '" ' +
           'height="' + (7 + r() * 13).toFixed(0) + '" fill="#2a3546" stroke="#3f4c60" transform="rotate(' + (r() * 40 - 20).toFixed(0) + ' 200 220)"/>';
    }
    for (i = 0; i < 3; i++) {
      s += '<ellipse cx="240" cy="252" rx="60" ry="16" fill="none" stroke="' + C.red + '" stroke-width="2" ' +
           'class="an-expand" style="--d:3.6s;--dl:' + (i * 1.2) + 's"/>';
    }
    return wrap(
      ground(252) + s +
      '<circle cx="146" cy="176" r="11" fill="' + C.green + '"/><rect x="140" y="188" width="12" height="30" rx="4" fill="' + C.green + '"/>' +
      '<circle cx="300" cy="176" r="11" fill="' + C.green + '"/><rect x="294" y="188" width="12" height="30" rx="4" fill="' + C.green + '"/>' +
      '<g class="an-blink" style="--d:1.5s">' +
      '<text x="370" y="130" font-size="30">⚠</text><text x="404" y="130" font-size="30">🔥</text></g>' +
      t(60, 110, '余震・ガス・火災・崩落が同時進行', 16, C.amber) +
      t(60, 296, '救助側は複数の危険に同時対応する（概念図）', 14, C.dim)
    );
  };

  /* 10 崩落原因 -------------------------------------------------------- */
  SCENES.collapse = function (big) {

    function play(name) {
      if (muted) return;
      var base = bank[name];
      if (!base) return;
      /* 連打しても重なるようにクローンを鳴らす */
      var a = base.cloneNode();
      a.volume = vol;
      var p = a.play();
      if (p && p.catch) {
        p.then(function () { markUnlocked(); })
         .catch(function () { /* 自動再生制限。最初のクリックで解除される */ });
      } else {
        markUnlocked();
      }
    }
    function markUnlocked() {
      if (unlocked) return;
      unlocked = true;
      if (audioNotice) audioNotice.classList.add('hide');
    }
    return {
      play: play,
      toggleMute: function () { muted = !muted; return muted; },
      isMuted: function () { return muted; },
      setVolume: function (v) {
        vol = Math.max(0, Math.min(1, v));
        for (var k in bank) { if (bank.hasOwnProperty(k)) bank[k].volume = vol; }
        return vol;
      },
      getVolume: function () { return vol; }
    };
  })();

  /* ========================= ブロック描画 ========================= */
  function tagsHtml(tags) {
    if (!tags || !tags.length) return '';
    return tags.map(function (t) {
      return '<span class="tag ' + t[0] + '">' + t[1] + '</span>';
    }).join('');
  }

  function listHtml(items, cls) {
    return '<ul class="' + (cls || '') + '">' +
      items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  }

  function photoHtml(p) {
    return '<figure class="photo-card">' +
      '<span class="badge ' + p.kind + '">' + p.badge + '</span>' +
      '<img src="' + p.src + '" alt="' + p.title.replace(/"/g, '') + '" loading="lazy">' +
      '<figcaption class="label"><b>' + p.title + '</b>' +
      '<span class="credit">' + p.credit + '</span></figcaption></figure>';
  }

  function slotHtml(b) {
    return '<div class="photo-slot">' +
      '<span class="badge slot" style="position:static">差し替えスロット</span>' +
      '<b>' + b.what + '</b>' +
      '<span>画像を <code>' + b.file + '</code> に置くと、ここに表示されます。<br>' +
      '権利処理を済ませたものだけを入れてください。</span></div>';
  }

  function block(b) {
    if (!b) return '';
    switch (b.t) {
      case 'panel':
        return '<div class="panel">' + tagsHtml(b.tags) +
               (b.items ? listHtml(b.items, b.cls) : '') +
               (b.html || '') + '</div>';
      case 'list':    return listHtml(b.items, b.cls);
      case 'quote':   return '<div class="quote">' + b.html + '</div>';
      case 'warning': return '<div class="warning">' + b.html + '</div>';
      case 'note':    return '<div class="note">' + b.html + '</div>';
      case 'photo':   return photoHtml(b.p);
      case 'slot':    return slotHtml(b);
      case 'html':    return b.html;
      case 'facts':
        return '<div class="facts">' + b.items.map(function (f) {
          return '<div class="fact"><b>' + f.v + '</b><span>' + f.l + '</span></div>';
        }).join('') + '</div>';
      case 'timeline':
        return '<div class="timeline">' + b.items.map(function (x) {
          return '<div class="time"><b>' + x.b + '</b><span>' + x.s + '</span></div>';
        }).join('') + '</div>';
      default:
        return '';
    }
  }
  function blocks(list) { return (list || []).map(block).join(''); }

  /* ========================= 常時アニメ層 ========================= */
  /* 全ページに必ず敷く。データに ambient が無ければシーンを順番に割り当てる */
  function ambientHtml(key, i) {
    var keys = window.SCENE_KEYS || [];
    var k = (key && SCENES[key]) ? key : keys[i % keys.length];
    return '<div class="ambient" aria-hidden="true">' +
      '<div class="seismo">' + seismoSvg() + '</div>' +
      '<div class="amb-art">' + SCENES[k](false) + '</div>' +
      '</div>';
  }

  /* 全ページ共通の、止まらない地震計ストリップ */
  function seismoSvg() {
    var d = 'M0 40', i, s = 1;
    for (i = 1; i <= 240; i++) {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      var r = s / 0x7fffffff;
      var burst = (i % 60 > 24 && i % 60 < 34);
      var amp = burst ? 30 : 7;
      d += ' L' + (i * 8) + ' ' + (40 + (i % 2 ? -1 : 1) * amp * (0.35 + r * 0.65)).toFixed(1);
    }
    /* 同じ波形を2本つなげて、-50% スクロールで継ぎ目なくループさせる */
    return '<svg viewBox="0 0 1920 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path class="line" d="' + d + '"/>' +
      '<path class="line" d="' + d + '" transform="translate(1920,0)"/></svg>';
  }

  /* ========================= スライド組み立て ========================= */
  function buildSlide(s, i) {
    var el = document.createElement('section');
    el.className = 'slide';
    el.dataset.index = String(i);

    var stageCls = 'stage ' + (s.layout === 'split' ? 'split' : 'full') +
                   (s.guardBottom ? ' guard-bottom' : '') +
                   (s.guardRight ? ' guard-right' : '');

    var stageInner = (s.layout === 'split')
      ? '<div>' + blocks(s.left) + '</div><div>' + blocks(s.right) + '</div>'
      : blocks(s.body);

    el.innerHTML =
      (s.bg ? '<div class="bg" style="background-image:url(\'' + s.bg + '\')"></div>' : '') +
      ambientHtml(s.ambient, i) +
      '<div class="brand"><div class="name">YOUTUBE VISUAL BRIEF</div>' +
      '<div class="pageno">' + pad(i + 1) + '<small> / ' + pad(SLIDES.length) + '</small></div></div>' +
      '<div class="content">' +
      '<div class="kicker"><span class="dot"></span>' + s.kicker + '</div>' +
      '<h' + (s.layout === 'full' && i === 0 ? '1' : '2') + '>' + s.title +
      '</h' + (s.layout === 'full' && i === 0 ? '1' : '2') + '>' +
      (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') +
      '<div class="' + stageCls + '">' + stageInner + '</div>' +
      '<div class="footer"><div class="source">' + (s.source || '') + '</div></div>' +
      '</div>';
    return el;
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  /* ========================= イメージモーダル ========================= */
  function openImage() {
    var s = SLIDES[idx];
    if (!s || !s.image) return;
    var im = s.image;
    var sceneKey = (im.scene && SCENES[im.scene]) ? im.scene : s.ambient;

    modal.innerHTML =
      '<div class="modal-wrap">' +
      '<button class="modal-close" type="button">閉じる ESC</button>' +
      '<div class="modal-head"><div>' +
      '<div class="modal-kicker">' + (im.kicker || 'イメージ') + '</div>' +
      '<h2>' + im.title + '</h2></div></div>' +
      '<div class="modal-body">' +
      '<div class="scene-stage">' + SCENES[sceneKey](true) +
      (im.caption ? '<div class="scene-cap">' + im.caption + '</div>' : '') + '</div>' +
      '<div class="scene-side">' + blocks(im.side) + '</div>' +
      '</div></div>';

    modal.querySelector('.modal-close').addEventListener('click', closeImage);
    modal.classList.add('open');
    imgBtn.classList.add('open');
    imgBtn.querySelector('.txt').textContent = '閉じる';
    SE.play('image');
  }

  function closeImage() {
    modal.classList.remove('open');
    modal.innerHTML = '';
    imgBtn.classList.remove('open');
    imgBtn.querySelector('.txt').textContent = 'イメージ';
  }

  function toggleImage() {
    if (modal.classList.contains('open')) { closeImage(); SE.play('image'); }
    else { openImage(); }
  }

  /* ========================= ナビゲーション ========================= */
  function show(n, opts) {
    opts = opts || {};
    var prevIdx = idx;
    idx = (n + SLIDES.length) % SLIDES.length;

    if (modal.classList.contains('open')) closeImage();

    slideEls.forEach(function (el, j) {
      el.classList.toggle('active', j === idx);
      el.classList.toggle('back', j === idx && opts.back === true);
    });

    progress.style.width = ((idx + 1) / SLIDES.length * 100) + '%';
    history.replaceState(null, '', '#' + (idx + 1));

    if (!opts.silent && prevIdx !== idx) SE.play('page');
  }

  function next() { show(idx + 1); }
  function prev() { show(idx - 1, { back: true }); }

  /* ========================= 初期化 ========================= */
  function init() {
    var frag = document.createDocumentFragment();
    SLIDES.forEach(function (s, i) {
      var el = buildSlide(s, i);
      slideEls.push(el);
      frag.appendChild(el);
    });
    deck.appendChild(frag);

    imgBtn.addEventListener('click', toggleImage);

    document.getElementById('btnPrev').addEventListener('click', prev);
    document.getElementById('btnNext').addEventListener('click', next);
    document.getElementById('btnFull').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    });

    var btnMute = document.getElementById('btnMute');
    btnMute.addEventListener('click', function () {
      var m = SE.toggleMute();
      btnMute.textContent = m ? '🔇' : '🔊';
      btnMute.classList.toggle('off', m);
    });

    var btnWipe = document.getElementById('btnWipe');
    btnWipe.addEventListener('click', cycleWipe);

    /* --- キーボード --- */
    addEventListener('keydown', function (e) {
      if (['ArrowRight', ' ', 'PageDown'].indexOf(e.key) >= 0) { e.preventDefault(); next(); }
      else if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); prev(); }
      else if (e.key === 'Home') show(0);
      else if (e.key === 'End') show(SLIDES.length - 1);
      else if (e.key === 'Escape') { if (modal.classList.contains('open')) closeImage(); }
      else if (e.key === 'i' || e.key === 'I') toggleImage();
      else if (e.key === 'w' || e.key === 'W') cycleWipe();
      else if (e.key === 'd' || e.key === 'D') wipe.classList.toggle('debug');
      else if (e.key === 'm' || e.key === 'M') btnMute.click();
    });

    /* --- ホイール / スワイプ --- */
    var wheelLock = 0;
    addEventListener('wheel', function (e) {
      var now = Date.now();
      if (Math.abs(e.deltaY) > 45 && now - wheelLock > 380) {
        wheelLock = now;
        if (e.deltaY > 0) next(); else prev();
      }
    }, { passive: true });

    var sx = 0;
    addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    addEventListener('touchend', function (e) {
      var d = e.changedTouches[0].clientX - sx;
      if (Math.abs(d) > 60) { if (d < 0) next(); else prev(); }
    }, { passive: true });

    /* --- 収録中はコントロールを自動的に隠す --- */
    var idleTimer;
    function poke() {
      controls.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { controls.classList.add('idle'); }, 2600);
    }
    addEventListener('mousemove', poke);
    addEventListener('keydown', poke);
    poke();

    /* --- 最初の操作で音声を解禁する（ブラウザの自動再生制限対策） --- */
    function unlock() {
      SE.setVolume(SE.getVolume());
      if (audioNotice) audioNotice.classList.add('hide');
      removeEventListener('pointerdown', unlock);
      removeEventListener('keydown', unlock);
    }
    addEventListener('pointerdown', unlock);
    addEventListener('keydown', unlock);
    /* 収録中に映り込まないよう、操作が無くても数秒で引っ込める */
    setTimeout(function () { if (audioNotice) audioNotice.classList.add('hide'); }, 6000);

    var hash = parseInt(location.hash.slice(1), 10);
    show(hash ? hash - 1 : 0, { silent: true });
  }

  /* ワイプ表示モード: ガイドあり → 枠なし → クロマキー → ガイドあり */
  function cycleWipe() {
    if (wipe.classList.contains('chroma')) {
      wipe.classList.remove('chroma', 'bare');
    } else if (wipe.classList.contains('bare')) {
      wipe.classList.remove('bare');
      wipe.classList.add('chroma');
    } else {
      wipe.classList.add('bare');
    }
  }

  /* デバッグ用に外へ出す（衝突チェックのスクリプトから使う） */
  window.DECK = {
    show: show, next: next, prev: prev,
    openImage: openImage, closeImage: closeImage,
    count: function () { return SLIDES.length; },
    current: function () { return idx; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
