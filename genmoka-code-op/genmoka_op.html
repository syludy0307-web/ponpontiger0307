<style>
:root{--bg:#0d0a08;--panel:#17120e;--line:#3a2e24;--fg:#f3e7d6;--dim:#a8977f;--acc:#e8a54a;--acc2:#c8452a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body.export{background:#000;overflow:hidden}
body.export #ui,body.export #loader{display:none!important}
body.export #stageWrap{width:1920px;height:1080px;max-width:none}
body.export #stage{width:1920px;height:1080px}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
#stageWrap{position:relative;width:100%;max-width:min(100vw,calc((100dvh - 132px)*16/9));aspect-ratio:16/9;background:#000}
#stage{display:block;width:100%;height:100%}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,8,6,.92);font-size:14px;color:var(--dim)}
#loader .bar{width:min(60%,420px);height:6px;border-radius:3px;background:#2a211a;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#ui{width:100%;max-width:min(100vw,calc((100dvh - 132px)*16/9));padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:var(--panel);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
button{appearance:none;border:1px solid var(--line);background:#221a14;color:var(--fg);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:15px;font-weight:600;touch-action:manipulation}
button:active{background:#33271e}
button.on{border-color:var(--acc);color:var(--acc)}
#bPlay{width:56px;height:56px;border-radius:50%;font-size:22px;background:var(--acc);color:#1a120c;border:none;flex:none}
#seekWrap{position:relative;flex:1;height:56px;display:flex;align-items:center}
#seek{width:100%;margin:0;height:56px;background:transparent;-webkit-appearance:none;appearance:none;position:relative;z-index:2}
#seek::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#3a2e24}
#seek::-moz-range-track{height:8px;border-radius:4px;background:#3a2e24}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--fg);border:3px solid var(--acc)}
#seek::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:3px solid var(--acc)}
#marks{position:absolute;left:13px;right:13px;top:0;bottom:0;pointer-events:none;z-index:1}
#marks i{position:absolute;top:16px;width:2px;height:24px;margin-left:-1px;background:var(--acc2);border-radius:1px}
#marks b{position:absolute;bottom:0;font-size:10px;font-weight:600;color:var(--dim);transform:translateX(-50%)}
#info{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info b{color:var(--fg)}
@media (orientation:portrait){#stageWrap,#ui{max-width:100vw}}
@media (max-width:480px){#info{font-size:13px}#info .wide{display:none}button{padding:0 9px}}
</style>

/* ---------------- 数学・乱数・ノイズ ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

/* ============================================================

const GEN_C = {
  red: hex('#c45f2b'), redDeep: hex('#9a4520'), redLight: hex('#da8a50'),
  white: hex('#fcf6ec'), cream: hex('#f0dcc0'), goma: hex('#22150f'), gomaSoft: hex('#5a3420'),

/* 首輪の縁に毛をかぶせるための領域マーク */
function offsetCurve(P, d) {
  return P.map((p, i) => {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    return [p[0] - ty * d, p[1] + tx * d];
  });
}
function collarEdgeMark(pts, width) {
  return {
    blur: 3, draw: c => {
      const P = sampleCurve(pts, 60);
      c.lineWidth = width * 0.42; c.beginPath(); smoothPath(c, offsetCurve(P, -0.46 * width), false); c.stroke();
      c.globalAlpha = 0.5; c.lineWidth = width * 0.3; c.beginPath(); smoothPath(c, offsetCurve(P, 0.5 * width), false); c.stroke();
    },
  };
}
/* 3/4顔の描画（パーツ合成＋毎フレームの目・鼻） */
const GEN_EYE_LID = {};
function genLidColor(E) {
  const key = E === GH.eyeN ? 'n' : 'f';
  if (!GEN_EYE_LID[key]) {
    const s = A('genHead').info.sample;
    GEN_EYE_LID[key] = { top: s((E.ic[0] + E.oc[0]) / 2, E.ap[1] - 26), mid: s((E.ic[0] + E.oc[0]) / 2 + 6, E.ap[1] - 10) };
  }
  return GEN_EYE_LID[key];
}
function drawGenEye(c, E, lid, look = 0, smile = 0.8) {
  // 毛は「閉じた目」の状態で焼いてあり、毎フレーム開いている部分だけを描く
  const mx = (E.ic[0] + E.oc[0]) / 2, my = (E.ic[1] + E.oc[1]) / 2, ew = Math.abs(E.oc[0] - E.ic[0]);
  const cu = [2 * E.ap[0] - mx, 2 * E.ap[1] - my];
  const cl = [2 * E.lo[0] - mx, 2 * (E.lo[1] - smile * 5) - my];
  const cL = [lerp(cu[0], cl[0], lid), lerp(cu[1], cl[1] - 5, lid)];
  const q = (t, c1) => [(1 - t) * (1 - t) * E.ic[0] + 2 * t * (1 - t) * c1[0] + t * t * E.oc[0], (1 - t) * (1 - t) * E.ic[1] + 2 * t * (1 - t) * c1[1] + t * t * E.oc[1]];
  const lidMid = q(0.5, cL), loMid = q(0.5, cl);
  const open = loMid[1] - lidMid[1];
  const opening = () => { c.beginPath(); c.moveTo(E.ic[0], E.ic[1]); c.quadraticCurveTo(cL[0], cL[1], E.oc[0], E.oc[1]); c.quadraticCurveTo(cl[0], cl[1], E.ic[0], E.ic[1]); c.closePath(); };
  c.save();
  // 目のまわりの黒い縁（アイリム）
  c.lineJoin = 'round'; c.lineCap = 'round';
  opening(); c.strokeStyle = 'rgba(20,10,6,0.92)'; c.lineWidth = 5.5; c.stroke();
  if (open > 0.6) {
    c.save(); opening(); c.clip();
    const ix = mx + look * ew * 0.12 + ew * 0.03, iy = (lidMid[1] + loMid[1]) / 2 + 1;
    const g = c.createRadialGradient(ix, iy, 0.5, ix, iy, ew * 0.5);
    g.addColorStop(0, '#050302'); g.addColorStop(0.5, '#0c0604'); g.addColorStop(0.8, '#221109'); g.addColorStop(1, '#110805');
    c.fillStyle = g; c.fillRect(mx - ew, my - ew, ew * 2, ew * 2);
    const g2 = c.createLinearGradient(0, loMid[1], 0, lidMid[1]);
    g2.addColorStop(0, 'rgba(255,140,60,0.28)'); g2.addColorStop(0.55, 'rgba(255,140,60,0)');
    c.fillStyle = g2; c.fillRect(mx - ew, my - ew, ew * 2, ew * 2);
    // 上まぶたの影
    c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(E.ic[0], E.ic[1]); c.quadraticCurveTo(cL[0], cL[1] + 2, E.oc[0], E.oc[1]); c.stroke();
    // キャッチライト（夕日側）
    const hx = ix + ew * 0.15, hy = lidMid[1] + Math.min(open * 0.45, 7.5);
    c.fillStyle = 'rgba(255,249,236,0.97)'; c.beginPath(); c.ellipse(hx, hy, ew * 0.068, Math.max(1.2, Math.min(ew * 0.055, open * 0.28)), -0.3, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,205,150,0.4)'; c.beginPath(); c.arc(ix - ew * 0.16, loMid[1] - Math.min(open * 0.3, 5), ew * 0.028, 0, 7); c.fill();
    c.restore();
  }
  // 上まぶたの縁
  c.strokeStyle = 'rgba(14,8,5,0.96)'; c.lineWidth = 3.4;
  c.beginPath(); c.moveTo(E.ic[0], E.ic[1]); c.quadraticCurveTo(cL[0], cL[1], E.oc[0], E.oc[1]); c.stroke();
  c.restore();
}

  c.fillStyle = 'rgba(255,250,240,0.8)'; c.beginPath(); c.ellipse(24, -38, 10, 4.5, -0.1, 0, 7); c.fill();

  c.restore();
}

<script>
'use strict';
/* ============================================================
   文字（3段階）：筆文字の縦書きタイトル → 明朝のサブタイトル → 話数タイトル
   ============================================================ */
const TXT = { brushSize: 150, brushStep: 168, brushX: 1652, brushTop: 132 };
function goldGrad(c, y0, y1) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#fff4c4'); g.addColorStop(0.22, '#f1cf72'); g.addColorStop(0.48, '#c38a2e'); g.addColorStop(0.62, '#f6dc8e'); g.addColorStop(0.82, '#b27826'); g.addColorStop(1, '#e8c268');
  return g;
}
/* 縦書き：Canvas は縦書き非対応なので 1 文字ずつ縦に置く */
function brushTitleLayer() {
  return A2('txtBrush', () => {
    const w = 300, h = 1000, c = mkCanvas(w, h), x = g2d(c), n = [...TITLE_MAIN];
    x.font = `${TXT.brushSize}px GMBrush`; x.textAlign = 'center'; x.textBaseline = 'middle';
    n.forEach((ch, i) => { const cy = 90 + i * TXT.brushStep; x.fillStyle = goldGrad(x, cy - TXT.brushSize * 0.5, cy + TXT.brushSize * 0.5); x.fillText(ch, w / 2, cy); });
    // 筆の縁を少し締める
    x.globalCompositeOperation = 'source-atop'; x.strokeStyle = 'rgba(110,62,18,0.55)'; x.lineWidth = 1.5;
    x.font = `${TXT.brushSize}px GMBrush`; n.forEach((ch, i) => x.strokeText(ch, w / 2, 90 + i * TXT.brushStep));
    return c;
  });
}
function brushTitle(ctx, t) {
  const a = ease.s(seg(t, 0.1, 0.5)) * (1 - ease.s(seg(t, 2.55, 2.95)));
  if (a <= 0.001) return;
  const src = brushTitleLayer(), w = src.width, h = src.height;
  const L = A2('txtBrushWork', () => mkCanvas(w, h)), lx = g2d(L);
  lx.clearRect(0, 0, w, h); lx.globalCompositeOperation = 'source-over'; lx.drawImage(src, 0, 0);
  // 光が一度だけ上から下へ走る
  const sw = seg(t, 0.95, 1.85);
  if (sw > 0 && sw < 1) {
    const yy = lerp(-200, h + 200, ease.io(sw));
    const g = lx.createLinearGradient(0, yy - 140, w * 0.3, yy + 140);
    g.addColorStop(0, 'rgba(255,255,240,0)'); g.addColorStop(0.5, 'rgba(255,253,235,0.95)'); g.addColorStop(1, 'rgba(255,255,240,0)');
    lx.globalCompositeOperation = 'source-atop'; lx.fillStyle = g; lx.fillRect(0, 0, w, h);
  }

  const blur = (1 - ease.o(seg(t, 0.1, 0.5))) * 12 + ease.i(seg(t, 2.55, 2.95)) * 6;
  ctx.save();

  ctx.globalAlpha = a * 0.8; ctx.filter = `blur(${(16 + blur).toFixed(1)}px)`;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(A2('txtBrushShadow2', () => { const c = mkCanvas(w, h), x = g2d(c); x.filter = 'blur(6px)'; x.drawImage(src, 0, 0); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#5a2c10'; x.fillRect(0, 0, w, h); return c; }), ox, oy + 4);
  ctx.drawImage(A2('txtBrushShadow', () => { const c = mkCanvas(w, h), x = g2d(c); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#3a1c0c'; x.fillRect(0, 0, w, h); return c; }), ox + 5, oy + 8);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a; ctx.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';

}
function minchoLayer(key, text, weight, size, spacing, align) {
  return A2(key, () => {
    const m = /^(第.+?話)\s*(.*)$/.exec(text);

    parts.forEach(([s, z], i) => { x.font = `${weight} ${z}px GMMincho`; x.letterSpacing = `${(z * spacing).toFixed(1)}px`; x.fillText(s, px, size * 1.5); px += widths[i] + gap; });

  ctx.drawImage(A2(L.key + 'sh', () => { const c = mkCanvas(L.width, L.height), s = g2d(c); s.drawImage(L, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = '#26140a'; s.fillRect(0, 0, c.width, c.height); return c; }), x + 2, y + 4);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a; ctx.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';

/* ============================================================
   仕上げ：ブルーム・周辺減光・色調
   ============================================================ */
function bloom(ctx, amt = 0.3) {
  const s = A2('bloomA', () => mkCanvas(480, 270)), b = A2('bloomB', () => mkCanvas(480, 270));

  bx.globalCompositeOperation = 'copy'; bx.filter = 'blur(9px)'; bx.drawImage(s, 0, 0); bx.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = amt; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(b, 0, 0, W, H); ctx.restore();
}
function vignetteLayer() {
  return A2('vignette', () => {
    const c = mkCanvas(W, H), x = g2d(c);
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);

    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.55, 'rgba(236,222,214,1)'); g.addColorStop(1, 'rgba(150,118,112,1)');

/* ============================================================

<script>
