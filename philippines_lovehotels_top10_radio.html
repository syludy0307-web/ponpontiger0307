<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>フィリピンで人気のラブホテル TOP10 完全版 | フィリピン夜のラジオ</title>
<style>
:root{--panel:rgba(6,14,29,.78);--panel2:rgba(7,11,24,.88);--text:#f6f8ff;--muted:#cdd5ff;--shadow:0 18px 50px rgba(0,0,0,.38)}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:#010815;color:var(--text);font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden} body{width:100vw;height:100vh}
.stage-wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 79% 14%,rgba(208,230,255,.18),transparent 24%),radial-gradient(circle at 12% 34%,rgba(70,140,255,.12),transparent 40%),radial-gradient(circle at 50% 98%,rgba(45,115,225,.20),transparent 46%),linear-gradient(180deg,#020817 0%,#04153a 30%,#083067 58%,#0d4184 80%,#134f9b 100%);overflow:hidden}
.floating-orb{position:absolute;border-radius:50%;filter:blur(8px);opacity:.15;animation:drift linear infinite}.orb1{width:180px;height:180px;left:6%;top:12%;background:#3f8bff;animation-duration:24s}.orb2{width:260px;height:260px;right:8%;top:8%;background:#7fb8ff;animation-duration:28s}.orb3{width:140px;height:140px;left:14%;bottom:14%;background:#2fd8c9;animation-duration:21s}.orb4{width:220px;height:220px;right:18%;bottom:10%;background:#9db9ff;animation-duration:29s}
.sparkles,.sparkles:before,.sparkles:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle, rgba(255,255,255,.92) 0 1px, transparent 1px),radial-gradient(circle, rgba(165,212,255,.66) 0 1px, transparent 1px),radial-gradient(circle, rgba(255,242,205,.5) 0 1px, transparent 1px);background-size:170px 170px,230px 230px,300px 300px;animation:stars 28s linear infinite;opacity:.5;pointer-events:none}.sparkles:before{animation-duration:36s;opacity:.3;background-size:130px 130px,210px 210px,340px 340px}.sparkles:after{animation-duration:20s;opacity:.22;background-size:260px 260px,190px 190px,330px 330px}

.light-beam.b2{left:auto;right:14%;background:linear-gradient(180deg,rgba(150,198,255,.11),rgba(150,198,255,.02),transparent);animation-duration:18s}
@keyframes beamMove{from{transform:skewX(-18deg) translateX(-2vw)}to{transform:skewX(-18deg) translateX(8vw)}}
@keyframes stars{from{transform:translateY(0)}to{transform:translateY(80px)}} @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}25%{transform:translate3d(30px,-25px,0) scale(1.08)}50%{transform:translate3d(-15px,20px,0) scale(.95)}75%{transform:translate3d(22px,18px,0) scale(1.02)}100%{transform:translate3d(0,0,0) scale(1)}}

.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(158,184,214,.38)}
.moon::before{width:26px;height:26px;left:24%;top:52%;box-shadow:40px -32px 0 -6px rgba(158,184,214,.34),54px 12px 0 -10px rgba(158,184,214,.3)}
.moon::after{width:14px;height:14px;left:60%;top:24%}

.cloud{position:absolute;border-radius:999px;filter:blur(16px);background:linear-gradient(180deg,rgba(188,214,255,.13),rgba(92,132,192,.05));animation:cloudDrift linear infinite;pointer-events:none}
.cloud.c1{width:460px;height:64px;top:19%;left:-30%;animation-duration:85s}
.cloud.c2{width:560px;height:86px;top:33%;left:-40%;animation-duration:115s;animation-delay:-45s}
.cloud.c3{width:380px;height:56px;top:55%;left:-26%;animation-duration:95s;animation-delay:-70s;opacity:.7}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(165vw)}}
.shooting-star{position:absolute;top:9%;left:12%;width:150px;height:2px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0));filter:drop-shadow(0 0 6px rgba(210,235,255,.9));transform:rotate(-24deg);opacity:0;animation:shoot 9s linear infinite;z-index:1}
.shooting-star.s2{top:24%;left:50%;width:110px;animation-duration:12.5s;animation-delay:5s}
@keyframes shoot{0%,86%{opacity:0;transform:rotate(-24deg) translateX(0)}89%{opacity:1}100%{opacity:0;transform:rotate(-24deg) translateX(42vw)}}
.cityline{position:absolute;inset:auto 0 0 0;height:28%;background:linear-gradient(to top,rgba(0,2,8,.78),rgba(0,0,0,0)),repeating-linear-gradient(90deg,rgba(255,244,205,.12) 0 2px,transparent 2px 16px),linear-gradient(0deg,rgba(45,80,150,.22),rgba(0,0,0,0));clip-path:polygon(0 100%,0 64%,4% 64%,4% 48%,7% 48%,7% 58%,10% 58%,10% 38%,14% 38%,14% 68%,18% 68%,18% 50%,22% 50%,22% 42%,26% 42%,26% 72%,31% 72%,31% 60%,34% 60%,34% 46%,38% 46%,38% 74%,43% 74%,43% 54%,49% 54%,49% 40%,53% 40%,53% 66%,57% 66%,57% 48%,61% 48%,61% 74%,67% 74%,67% 44%,72% 44%,72% 58%,76% 58%,76% 36%,82% 36%,82% 72%,88% 72%,88% 48%,93% 48%,93% 62%,100% 62%,100% 100%);opacity:.92}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);opacity:.06;pointer-events:none}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));box-shadow:0 20px 80px rgba(0,0,0,.45)}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 40%,rgba(255,255,255,.04) 45%,transparent 48%,transparent 100%);animation:sheen 9s linear infinite;pointer-events:none}@keyframes sheen{from{transform:translateX(-90%)}to{transform:translateX(90%)}}
.top-bar{position:absolute;inset:18px 24px auto 24px;display:flex;justify-content:space-between;align-items:flex-start;z-index:25}.show-chip{padding:10px 14px;border-radius:16px;background:rgba(8,15,28,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);font-size:14px;line-height:1.35;color:var(--muted);max-width:48%}.show-chip strong{color:white}.neon-title{font-size:30px;font-weight:800;letter-spacing:.08em;color:#dffbff;text-shadow:0 0 6px rgba(124,247,255,.95),0 0 14px rgba(124,247,255,.9),0 0 28px rgba(255,98,198,.68),0 0 42px rgba(255,98,198,.48);animation:neonFlicker 2.2s infinite alternate;padding:8px 14px 10px;border-radius:14px;border:1px solid rgba(124,247,255,.36);background:rgba(10,12,23,.26);backdrop-filter:blur(8px)}@keyframes neonFlicker{0%,18%,22%,53%,57%,100%{opacity:1;filter:brightness(1)}20%,55%{opacity:.78;filter:brightness(1.18)}24%{opacity:.9;filter:brightness(.95)}}
.slides{position:absolute;inset:0}.slide{position:absolute;inset:0;padding:96px 28px 28px;opacity:0;transform:translateX(5%) scale(.985);transition:opacity .65s ease,transform .65s ease;pointer-events:none}.slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.content-grid{display:grid;grid-template-columns:1.14fr .78fr;grid-template-rows:minmax(0,1fr);gap:18px;height:100%}.left-col{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;min-width:0;min-height:0}.right-col{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr) 88px 128px;gap:12px;min-width:0;min-height:0;height:100%}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);overflow:hidden;position:relative}.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.06),transparent 28%,transparent 72%,rgba(255,255,255,.05));pointer-events:none}.hero{padding:16px 22px 14px}.rank-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:700;font-size:15px;margin-bottom:12px}.rank-circle{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#001018;font-weight:900;box-shadow:0 0 18px currentColor}.hotel-name{font-size:38px;font-weight:900;line-height:1.04;margin:0 0 8px}.tagline{font-size:17px;margin-bottom:10px;color:#e5eaff}.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.meta-chip{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--muted);font-size:14px}.summary{font-size:16px;line-height:1.55;color:#f8fbff}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}.info-box{padding:16px 16px 14px;display:flex;flex-direction:column;min-height:0}.box-title{font-size:17px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px}.box-title::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor}ul.bullets{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;line-height:1.42;color:#f1f5ff}ul.bullets li::marker{color:#86dfff}
.price-strip{display:grid;grid-template-columns:1fr 1fr;gap:14px}.price-card{padding:13px 16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}.price-card::before{content:"";position:absolute;inset:-20% auto auto -20%;width:60%;height:70%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);animation:pulseGlow 3.8s ease-in-out infinite}.price-card h4{margin:0 0 8px;font-size:14px;color:#cceeff;letter-spacing:.08em}.price-num{font-size:21px;font-weight:900;line-height:1.15}.price-note{font-size:12px;color:#cbd5ff;line-height:1.45;margin-top:8px}.bestfor{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.16);border:1px dashed rgba(255,255,255,.18);font-size:13px;color:#fff}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.15);opacity:.18}}
.photo-card{display:flex;flex-direction:column;min-height:0;cursor:pointer;user-select:none;transform-origin:center;transition:transform .25s ease,box-shadow .25s ease}.photo-card:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 30px rgba(0,0,0,.3)}.photo-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}.photo-head strong{font-size:14px}.tap-note{font-size:11px;color:#b6d7ff;letter-spacing:.04em;white-space:nowrap}.photo-body{position:relative;flex:1;min-height:0;overflow:hidden}.photo-body img{width:100%;height:100%;object-fit:cover;display:block;animation:slowZoom 12s ease-in-out infinite alternate}.photo-overlay{position:absolute;left:12px;right:12px;bottom:10px;padding:8px 11px;border-radius:12px;background:rgba(0,2,10,.5);border:1px solid rgba(255,255,255,.16);font-size:12px;line-height:1.4;color:#edf5ff}@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.gallery-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
.mini-card{position:relative;display:block;border-radius:14px;overflow:hidden;cursor:pointer;min-height:0}
.mini-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.mini-card:hover img{transform:scale(1.07)}
.mini-label{position:absolute;left:7px;bottom:6px;padding:3px 8px;border-radius:8px;background:rgba(2,10,24,.74);border:1px solid rgba(255,255,255,.18);font-size:11px;font-weight:700;color:#dfeaff;letter-spacing:.02em;z-index:2}
.wipe-space{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 14px;border:2px dashed rgba(255,255,255,.25);background:radial-gradient(circle at 50% 18%,rgba(124,247,255,.16),transparent 40%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02))}.wipe-title{font-size:16px;font-weight:800;margin-bottom:6px}.wipe-sub{font-size:12px;color:var(--muted);line-height:1.5}
.cover-layout{display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:minmax(0,1fr);gap:16px;height:100%}.cover-main{padding:24px 26px 64px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{color:#98d6ff;text-transform:uppercase;letter-spacing:.25em;font-weight:800;font-size:15px}.cover-title{font-size:56px;font-weight:900;line-height:1.02;margin:10px 0 12px}.cover-title span{color:#ffd166;text-shadow:0 0 24px rgba(255,209,102,.32)}.cover-desc{font-size:17px;line-height:1.6;color:#edf2ff}.criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.criteria .meta-chip{font-size:14px;padding:11px 13px}.highlight-banner{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(90deg,rgba(255,98,198,.14),rgba(124,247,255,.12));border:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.5}.cover-side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr) 88px 128px;gap:12px;min-height:0;height:100%}
.flash-banner{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,209,102,.18),rgba(255,98,198,.14),rgba(124,247,255,.16));border:1px solid rgba(255,255,255,.15);font-size:15px;font-weight:800;animation:flashy 2.6s infinite alternate}@keyframes flashy{from{filter:brightness(1)}to{filter:brightness(1.22)}}
.nav-controls{position:absolute;left:26px;right:26px;bottom:18px;display:flex;justify-content:space-between;align-items:center;z-index:30}.btn-row{display:flex;gap:10px}.nav-btn{appearance:none;border:none;cursor:pointer;padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.04em;color:white;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);transition:transform .2s ease,background .2s ease}.nav-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.18)}.nav-btn:active{transform:scale(.98)}.page-indicator{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12)}.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:transform .2s ease,background .2s ease}.dot.active{transform:scale(1.55);background:#7cf7ff;box-shadow:0 0 10px rgba(124,247,255,.9)}.counter{font-size:14px;color:var(--muted);min-width:120px;text-align:right}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.84);z-index:999;padding:30px}.modal.open{display:grid}.modal-card{width:min(92vw,1500px);height:min(88vh,860px);background:#020712;border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.55);display:grid;grid-template-rows:auto 1fr}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1)}.modal-title{font-size:18px;font-weight:800}.close-btn{appearance:none;border:none;cursor:pointer;padding:10px 14px;border-radius:12px;color:white;background:rgba(255,255,255,.1)}.modal-body{background:#020712;display:grid;place-items:center;overflow:auto}.modal-body img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.equalizer{position:absolute;right:22px;bottom:70px;width:140px;height:44px;display:flex;align-items:flex-end;gap:4px;opacity:.55}.equalizer span{flex:1;border-radius:999px 999px 0 0;background:linear-gradient(180deg,#7cf7ff,#ff62c6);animation:eq 1.2s ease-in-out infinite}.equalizer span:nth-child(2){animation-delay:.1s}.equalizer span:nth-child(3){animation-delay:.25s}.equalizer span:nth-child(4){animation-delay:.05s}.equalizer span:nth-child(5){animation-delay:.34s}.equalizer span:nth-child(6){animation-delay:.18s}.equalizer span:nth-child(7){animation-delay:.4s}.equalizer span:nth-child(8){animation-delay:.13s}@keyframes eq{0%,100%{height:24%}20%{height:85%}40%{height:40%}60%{height:95%}80%{height:55%}}.small-note{font-size:13px;color:#bfc7ea;line-height:1.5}
.badge-live{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:13px;font-weight:700;margin-right:8px}.badge-live i{width:9px;height:9px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 12px #ff4d6d;display:inline-block;animation:liveBlink 1.2s infinite}@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.35}}
.note-bar{margin-top:10px;font-size:12px;color:#d7dcff;line-height:1.45;opacity:.95}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="sparkles"></div>
  <div class="moon"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="shooting-star"></div><div class="shooting-star s2"></div>
  <div class="light-beam"></div><div class="light-beam b2"></div>
  <div class="floating-orb orb1"></div><div class="floating-orb orb2"></div><div class="floating-orb orb3"></div><div class="floating-orb orb4"></div>
  <div class="cityline"></div><div class="scanlines"></div>
  <div class="stage" id="stage">
    <div class="top-bar">
      <div class="show-chip"><strong>特集テーマ：</strong>フィリピンで人気のラブホテル TOP10 完全版<br>10位→1位の順で紹介する、夜空背景＆イメージ画像 増量版。</div>
      <div class="neon-title">フィリピン夜のラジオ</div>
    </div>
    <div class="slides" id="slides"></div>
    <div class="equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="nav-controls">
      <div class="btn-row"><button class="nav-btn" id="prevBtn">◀ 前のページ</button><button class="nav-btn" id="nextBtn">次のページ ▶</button></div>
      <div class="page-indicator"><div class="dots" id="dots"></div><div class="counter" id="counter"></div></div>
    </div>
  </div>

function buildSlide(slide,index){if(slide.type==='cover'){return `<section class="slide" data-index="${index}"><div class="cover-layout"><div class="panel cover-main"><div><div class="eyebrow">Philippines Night Radio Special</div><div class="cover-title">${slide.title}</div><div class="cover-desc">${slide.desc}</div><div class="criteria">${slide.criteria.map(c=>`<div class="meta-chip">${c}</div>`).join('')}</div><div class="flash-banner"><span class="badge-live"><i></i>ON AIR</span>夜空背景＆イメージ画像 増量版</div><div class="highlight-banner">${slide.note}</div></div><div class="small-note">操作：<strong>→ / ← キー</strong> または下のボタン。ページ移動時に「シーン切り替え２　ブオッ」SEが鳴ります。画像はタップで拡大。</div></div><div class="cover-side">${makePhotoCard('夜景（実写風イラスト）',slide.actual,'マニラ湾の夜景イメージ','夜の青空とマニラ湾の実写風イラスト。実写真への差し替えにも対応。')}${makePhotoCard('番組イメージ（イラスト）',slide.concept,'夜のラジオスタジオ','番組の雰囲気を伝えるスタジオイラスト。')}${galleryStrip(slide)}<div class="panel wipe-space"><div class="wipe-title">ワイプ用スペース</div><div class="wipe-sub">右下は顔出し・リアクション用の固定スペース。</div></div></div></div></section>`}
