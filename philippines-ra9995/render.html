<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>RA9995 Short Renderer</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script src="assets/img/photos.js"></script>
<script>
'use strict';
const TL = window.TIMELINE;
const W = TL.W, H = TL.H;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const IMGS = {};

// ---------- utils ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,p)=>a+(b-a)*p;
const fract = x=>x-Math.floor(x);
const rnd = i=>fract(Math.sin(i*127.1+311.7)*43758.5453);
const easeOutQuad = p=>1-(1-p)*(1-p);
const easeInQuad = p=>p*p;
const easeInOut = p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOutCubic = p=>1-Math.pow(1-p,3);
const easeOutQuint = p=>1-Math.pow(1-p,5);
const easeOutBack = (p,s=2.2)=>{const c=s+1;return 1+c*Math.pow(p-1,3)+s*Math.pow(p-1,2);};
const easeOutElastic = p=>p<=0?0:p>=1?1:Math.pow(2,-10*p)*Math.sin((p*10-0.75)*(2*Math.PI/3))+1;
const easeOutBounce = p=>{const n=7.5625,d=2.75;
  if(p<1/d)return n*p*p; if(p<2/d)return n*(p-=1.5/d)*p+.75;
  if(p<2.5/d)return n*(p-=2.25/d)*p+.9375; return n*(p-=2.625/d)*p+.984375;};

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const SANS='"Noto Sans CJK JP"', SERIF='"Noto Serif CJK JP"', EMOJI='"Noto Color Emoji"';
const COL={w:'#FFFFFF',r:'#FF4A3D',g:'#FFCF3F',b:'#5CB6FF',ink:'#10131F',
  phBlue:'#0E4BC3',phRed:'#D6203A',phYellow:'#FCD116',
  bgTop:'#0B1026',bgBot:'#131F49'};

function goldGrad(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#FFF3B0');g.addColorStop(.45,'#FFD34D');g.addColorStop(.55,'#F7A928');g.addColorStop(1,'#FFCE45');return g;}

const mCache=new Map();
function chW(font,ch){const k=font+'|'+ch;let v=mCache.get(k);
  if(v===undefined){ctx.font=font;v=ctx.measureText(ch).width;mCache.set(k,v);}return v;}

// ---------- styled segment text ----------
function segText(segs,o){
  const font=`900 ${o.size}px ${o.font||SANS}`;
  const chars=[];
  for(const s of segs)for(const ch of s.t)chars.push({ch,c:s.c});
  let total=0;for(const c of chars)total+=chW(font,c.ch);
  let cx=(o.x!==undefined?o.x:W/2)-total/2;
  const t=o.t,t0=o.t0,st=o.stagger!==undefined?o.stagger:.022,pd=o.popDur||.17;
  ctx.save();ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineCap='round';
  for(let i=0;i<chars.length;i++){
    const c=chars[i],w=chW(font,c.ch);
    let sc=1,al=1;
    if(!o.fixed){
      const p=(t-(t0+i*st))/pd;
      if(p<=0){cx+=w;continue;}
      sc=p>=1?1:easeOutBack(p);al=clamp(p*2.5,0,1);
    }
    if(o.kwBounce!==false&&c.c!=='w'&&c.c!=='k')sc*=1+0.045*Math.sin(t*6.5+i*1.3);
    ctx.save();ctx.translate(cx+w/2,o.y);ctx.scale(sc,sc);
    ctx.globalAlpha=(o.alpha!==undefined?o.alpha:1)*al;
    ctx.font=font;
    ctx.strokeStyle=o.strokeCol||COL.ink;ctx.lineWidth=(o.strokeW!==undefined?o.strokeW:o.size*.18);
    ctx.strokeText(c.ch,0,0);
    if(c.c==='g'){ctx.fillStyle=goldGrad(-o.size*.55,o.size*.55);}
    else ctx.fillStyle=COL[c.c]||c.c||'#fff';
    ctx.fillText(c.ch,0,0);
    ctx.restore();
    cx+=w;
  }
  ctx.restore();
  return total;
}

function popIn(t,t0,dur=.2){const p=(t-t0)/dur;return p<=0?0:p>=1?1:easeOutBack(p);}
function elasticIn(t,t0,dur=.55){const p=(t-t0)/dur;return p<=0?0:easeOutElastic(clamp(p,0,1));}
function boyonSc(t,t0){
  const p=(t-t0);if(p<0)return null;
  const sy=easeOutElastic(clamp(p/.6,0,1));
  const sx=clamp(2-sy,.55,1.45);
  return {sx,sy};
}
function outSc(t,tEnd,dur=.16){
  if(t<tEnd)return 1;const p=(t-tEnd)/dur;return p>=1?0:1-easeInQuad(p);}

// ---------- photo helpers ----------
function kbDraw(key,dx,dy,dw,dh,t,o){
  const img=IMGS[key];if(!img)return false;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const p=clamp((t-(o.t0||0))/((o.t1||1)-(o.t0||0)||1),0,1);
  const z=lerp(o.z0||1.05,o.z1||1.2,p);
  const scale=Math.max(dw/iw,dh/ih)*z;
  const sw=dw/scale,sh=dh/scale;
  const fx=o.fx!==undefined?o.fx:.5,fy=o.fy!==undefined?o.fy:.5;
  const sx=clamp(fx*iw-sw/2+(o.panX||0)*p*iw,0,iw-sw);
  const sy=clamp(fy*ih-sh/2+(o.panY||0)*p*ih,0,ih-sh);
  ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
  return true;
}
function photoBG(key,t,o,tintTop,tintBot,extra){
  if(!kbDraw(key,0,0,W,H,t,o)){return;}
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,tintTop);g.addColorStop(1,tintBot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(extra==='red'){const pulse=.5+.5*Math.sin(t*3.4);
    const rv=ctx.createRadialGradient(W/2,H/2,400,W/2,H/2,1300);
    rv.addColorStop(0,'rgba(0,0,0,0)');rv.addColorStop(1,`rgba(214,32,58,${0.12+0.12*pulse})`);
    ctx.fillStyle=rv;ctx.fillRect(0,0,W,H);}
}

// ---------- impacts ----------
const IMPACTS=[
  {t:2.15,amp:6},
  {t:3.60,amp:22,fl:{c:'255,42,30',a:.45}},
  {t:4.98,amp:5},
  {t:8.08,amp:26,fl:{c:'255,42,30',a:.34},bu:{x:540,y:1250,cols:['#FF5A4E','#fff'],n:30,sp:920},ln:1},
  {t:9.10,amp:10,fl:{c:'255,255,255',a:.12}},
  {t:10.70,amp:6},
  {t:14.90,amp:12},{t:15.55,amp:12},{t:16.60,amp:12},{t:17.60,amp:12},
  {t:18.50,amp:16,fl:{c:'255,42,30',a:.22}},
  {t:19.52,amp:18,fl:{c:'255,201,51',a:.24},bu:{x:540,y:1080,cols:['#FFD34D','#FFF3B0','#fff'],n:24,sp:800}},
  {t:21.40,amp:8},
  {t:23.15,amp:8},
  {t:25.10,amp:16,fl:{c:'255,201,51',a:.2}},
  {t:25.80,amp:14,fl:{c:'255,255,255',a:.32},zm:1},
  {t:26.55,amp:10},
  {t:27.60,amp:10},
  {t:29.42,amp:20,fl:{c:'255,42,30',a:.28},bu:{x:540,y:500,cols:['#FF5A4E','#fff'],n:22,sp:780},ln:1},
  {t:32.95,amp:16,fl:{c:'255,42,30',a:.18},bu:{x:540,y:860,cols:['#EAF0FF','#9FB0D8','#fff'],n:22,sp:700}},
  {t:35.70,amp:16,fl:{c:'255,42,30',a:.18},bu:{x:540,y:860,cols:['#EAF0FF','#9FB0D8','#fff'],n:22,sp:700}},
  {t:39.00,amp:26,fl:{c:'255,42,30',a:.3},bu:{x:540,y:860,cols:['#EAF0FF','#9FB0D8','#fff'],n:34,sp:900},ln:1},
  {t:41.82,amp:18,fl:{c:'255,201,51',a:.22},conf:1},
  {t:43.65,amp:14,fl:{c:'255,201,51',a:.18}},
  {t:45.92,amp:24,fl:{c:'255,42,30',a:.3},ln:1},
  {t:47.50,amp:6},
];
function shakeOffset(t){
  let x=0,y=0;
  for(const im of IMPACTS){const d=t-im.t;
    if(d>0&&d<.5){const k=im.amp*Math.pow(1-d/.5,2.2);
      const f=Math.floor(t*60);
      x+=(rnd(f*3.7+im.t*91)-.5)*2*k;y+=(rnd(f*5.3+im.t*57)-.5)*2*k;}}
  return {x,y};
}
function worldZoom(t){
  let z=1;
  for(const im of IMPACTS){if(!im.zm)continue;const d=t-im.t;
    if(d>0&&d<.55)z+=0.12*Math.pow(1-d/.55,2);}
  return z;
}
function drawFlashes(t){
  for(const im of IMPACTS){if(!im.fl)continue;const d=t-im.t;
    if(d>0&&d<.3){ctx.fillStyle=`rgba(${im.fl.c},${im.fl.a*(1-d/.3)})`;ctx.fillRect(0,0,W,H);}}
}
function drawBursts(t){
  for(const im of IMPACTS){
    if(im.bu){const b=im.bu,d=t-im.t;
      if(d>0&&d<.75){for(let i=0;i<b.n;i++){
        const a=rnd(i*7+im.t*13)*Math.PI*2,sp=b.sp*(0.45+rnd(i*3+1)*0.8);
        const pr=easeOutCubic(clamp(d/.75,0,1));
        const px=b.x+Math.cos(a)*sp*pr,py=b.y+Math.sin(a)*sp*pr*0.85+(im.bu.grav?260*d*d:0);
        const sz=(4+rnd(i*11)*11)*(1-pr);
        ctx.fillStyle=b.cols[i%b.cols.length];ctx.globalAlpha=1-pr;
        ctx.save();ctx.translate(px,py);ctx.rotate(a+pr*6);
        ctx.fillRect(-sz,-sz*.45,sz*2,sz*.9);ctx.restore();}
        ctx.globalAlpha=1;}}
    if(im.conf){const d=t-im.t;
      if(d>0&&d<1.6){for(let i=0;i<26;i++){
        const x0=rnd(i*13+2)*W,vy=500+rnd(i*17)*420;
        const px=x0+Math.sin(d*4+i)*60,py=-40+vy*d;
        if(py>H+40)continue;
        const cols=['#FFD34D','#FF5A4E','#5CB6FF','#fff','#FCD116'];
        ctx.fillStyle=cols[i%cols.length];ctx.globalAlpha=clamp(1.6-d,0,1)*.9;
        ctx.save();ctx.translate(px,py);ctx.rotate(d*7+i);ctx.fillRect(-9,-6,18,12);ctx.restore();}
        ctx.globalAlpha=1;}}
  }
}
function drawSpeedlines(t){
  for(const im of IMPACTS){if(!im.ln)continue;const d=t-im.t;
    if(d>0&&d<.4){const al=(1-d/.4)*.75;
      ctx.save();ctx.translate(W/2,H/2);
      for(let i=0;i<26;i++){
        const a=rnd(i*31+im.t*7)*Math.PI*2+Math.floor(t*30)*.13;
        const r0=430+rnd(i*5)*180,r1=1250;
        const wdt=(2+rnd(i*9)*9)*al;
        ctx.strokeStyle=`rgba(255,255,255,${al*(0.35+rnd(i)*0.6)})`;
        ctx.lineWidth=wdt;ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
        ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.stroke();}
      ctx.restore();}}
}

// ---------- backgrounds ----------
const SEC_ACCENT={hook:'#FF5A4E',law:'#FF7A5C',reach:'#5CB6FF',excuse:'#FF5A4E',penalty:'#FFC933'};
function drawBG(t,sec){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(sec==='excuse'){g.addColorStop(0,'#150A12');g.addColorStop(1,'#31101E');}
  else if(sec==='reach'){g.addColorStop(0,'#0A1420');g.addColorStop(1,'#12324A');}
  else if(sec==='law'){g.addColorStop(0,'#0B1026');g.addColorStop(1,'#131F49');}
  else{g.addColorStop(0,'#0B0A18');g.addColorStop(1,'#1A1030');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gx=W/2+Math.sin(t*.5)*120,gy=760+Math.cos(t*.4)*90;
  const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,900);
  rg.addColorStop(0,'rgba(120,150,255,0.14)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-Math.PI/7);
  const period=240,off=(t*70)%period;
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let x=-1700+off;x<1700;x+=period)ctx.fillRect(x,-1400,110,2800);
  ctx.restore();
  const ac=SEC_ACCENT[sec]||'#fff';
  for(let i=0;i<24;i++){
    const spd=26+rnd(i*3)*44;
    const px=rnd(i*7)*W+Math.sin(t*(.5+rnd(i)*0.7)+i)*44;
    const py=(H+140-((t*spd+rnd(i*13)*H)%(H+280)));
    const sz=2.5+rnd(i*11)*6;
    ctx.globalAlpha=.10+rnd(i*5)*.16;ctx.fillStyle=i%3?'#FFFFFF':ac;
    ctx.beginPath();ctx.arc(px,py,sz,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  if(sec==='excuse'){const pulse=.5+.5*Math.sin(t*5);
    const rv=ctx.createRadialGradient(W/2,H/2,300,W/2,H/2,1250);
    rv.addColorStop(0,'rgba(0,0,0,0)');rv.addColorStop(1,`rgba(214,32,58,${0.12+0.1*pulse})`);
    ctx.fillStyle=rv;ctx.fillRect(0,0,W,H);}
}
function paperGhost(cy,rot){
  ctx.save();ctx.globalAlpha=.07;ctx.translate(W/2,cy);ctx.rotate(rot);
  ctx.fillStyle='#fff';rr(-430,-480,860,960,26);ctx.fill();
  ctx.fillStyle='#000';for(let i=0;i<11;i++)rr(-370,-400+i*82,i%3?700:520,20,10),ctx.fill();
  ctx.restore();
}

// ---------- custom art ----------
// 大きな✖（叩きつけ）
function drawX(t,t0,x,y,size,tEnd){
  const sp=(t-t0)/.13;if(sp<0)return;
  const k=sp>=1?1:easeOutQuint(clamp(sp,0,1));
  const sc=(2.8-1.8*k)*outSc(t,tEnd||1e9);if(sc<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.06+Math.sin(t*2)*.01);ctx.scale(sc,sc);
  ctx.globalAlpha=clamp(sp*3,0,1);
  ctx.lineCap='round';
  ctx.strokeStyle='#10131F';ctx.lineWidth=size*.34;
  ctx.beginPath();ctx.moveTo(-size/2,-size/2);ctx.lineTo(size/2,size/2);
  ctx.moveTo(size/2,-size/2);ctx.lineTo(-size/2,size/2);ctx.stroke();
  ctx.strokeStyle='#FF2A1E';ctx.lineWidth=size*.22;
  ctx.beginPath();ctx.moveTo(-size/2,-size/2);ctx.lineTo(size/2,size/2);
  ctx.moveTo(size/2,-size/2);ctx.lineTo(-size/2,size/2);ctx.stroke();
  ctx.restore();
}
// スマホを持つ手元シルエット＋画面の光
function drawPhoneHands(t){
  const cx=W/2,cy=1520;
  const gl=ctx.createRadialGradient(cx,cy-160,40,cx,cy-160,520);
  gl.addColorStop(0,'rgba(190,220,255,0.30)');gl.addColorStop(.5,'rgba(120,160,255,0.10)');gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.04+Math.sin(t*1.4)*.01);
  ctx.fillStyle='#05070F';
  rr(-170,-290,340,420,36);ctx.fill();
  ctx.fillStyle='#BDD7FF';ctx.globalAlpha=.9;
  rr(-146,-266,292,372,22);ctx.fill();
  ctx.globalAlpha=.55;ctx.fillStyle='#7FA8E8';
  for(let i=0;i<4;i++)rr(-110,-220+i*84,i%2?200:150,44,20),ctx.fill();
  ctx.globalAlpha=1;
  // 親指のシルエット（下から持つ手）
  ctx.fillStyle='#04060C';
  ctx.beginPath();ctx.ellipse(-120,150,66,120,.55,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(120,158,66,120,-.55,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,240,240,130,0,0,7);ctx.fill();
  ctx.restore();
}
// 赤い格子が降りてくる
function drawRedGrid(t,t0){
  const p=clamp((t-t0)/.8,0,1);if(p<=0)return;
  const dy=-H*(1-easeOutBounce(p));
  ctx.save();ctx.translate(0,dy);ctx.globalAlpha=.42;
  ctx.strokeStyle='#FF2A1E';ctx.lineWidth=14;
  for(let x=70;x<W;x+=145){ctx.beginPath();ctx.moveTo(x,-40);ctx.lineTo(x,H+40);ctx.stroke();}
  for(let y=140;y<H;y+=250){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
}
// 手錠（v1移植）
function drawCuffs(x,y,s,t){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(Math.sin(t*2.2)*.06);
  ctx.strokeStyle='#C9D4EE';ctx.lineWidth=13;ctx.lineCap='round';
  for(const sd of[-1,1]){
    ctx.save();ctx.translate(sd*52,0);
    ctx.beginPath();ctx.arc(0,0,40,0,7);ctx.stroke();
    ctx.fillStyle='#9FB0D8';rr(-14,-58,28,24,6);ctx.fill();ctx.restore();}
  ctx.beginPath();ctx.moveTo(-14,2);ctx.lineTo(14,2);ctx.stroke();
  ctx.restore();
}
function emoji(ch,x,y,size,t,t0,wob){
  const p=elasticIn(t,t0,.5);if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.scale(p,p);
  if(wob)ctx.rotate(Math.sin(t*5+x)*.09);
  ctx.font=`${size}px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ch,0,0);ctx.restore();
}

// ---------- big blocks ----------
function megaText(lines,o){
  ctx.save();
  const bob=o.bob!==false;
  const baseX=o.x!==undefined?o.x:W/2;
  for(const L of lines){
    const p=o.pop!==undefined?o.pop:1;if(p<=0)continue;
    ctx.save();
    const byy=bob?Math.sin(o.t*2.3+L.y)*5:0;
    ctx.translate(baseX,L.y+byy);
    ctx.rotate((L.rot||0)+(bob?Math.sin(o.t*1.6+L.y*.7)*.012:0));
    let sx=p,sy=p;
    if(o.boyon){const b=boyonSc(o.t,o.boyon);if(!b){ctx.restore();continue;}sx=b.sx;sy=b.sy;}
    else if(o.slam){const sp=(o.t-o.slam)/.14;
      if(sp<0){ctx.restore();continue;}
      const k=sp>=1?1:easeOutQuint(clamp(sp,0,1));sx=sy=2.7-1.7*k;
      ctx.globalAlpha=clamp(sp*3,0,1);}
    ctx.scale(sx,sy);
    ctx.font=`900 ${L.size}px ${L.font||SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle=COL.ink;ctx.lineWidth=L.size*.24;ctx.strokeText(L.txt,0,0);
    ctx.strokeStyle='#fff';ctx.lineWidth=L.size*.09;
    if(L.fill!=='white')ctx.strokeText(L.txt,0,0);
    if(L.fill==='red')ctx.fillStyle='#FF3B2F';
    else if(L.fill==='gold')ctx.fillStyle=goldGrad(-L.size*.55,L.size*.55);
    else ctx.fillStyle='#fff';
    ctx.fillText(L.txt,0,0);
    ctx.restore();}
  ctx.restore();
}
function pillBlock(t,t0,x,y,txt,size,border,fill,boyon){
  let sx=1,sy=1;
  if(boyon){const b=boyonSc(t,t0);if(!b)return;sx=b.sx;sy=b.sy;}
  else{const p=popIn(t,t0,.2);if(p<=0)return;sx=sy=p;}
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);
  ctx.font=`900 ${size}px ${SANS}`;
  const pw=ctx.measureText(txt).width+130;
  ctx.fillStyle='rgba(6,9,22,0.82)';rr(-pw/2,-size*1.05,pw,size*2.1,size*1.05);ctx.fill();
  ctx.strokeStyle=border;ctx.lineWidth=7;rr(-pw/2,-size*1.05,pw,size*2.1,size*1.05);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.strokeStyle=COL.ink;ctx.lineWidth=size*.16;ctx.strokeText(txt,0,2);
  if(fill==='gold')ctx.fillStyle=goldGrad(-size,size);else ctx.fillStyle=fill;
  ctx.fillText(txt,0,2);
  ctx.restore();
}
// ミニスタンプ（動詞用）
function miniStamp(t,t0,x,y,txt,glowT){
  const p=popIn(t,t0,.13);if(p<=0)return;
  const sc=2.2-1.2*clamp(p,0,1);
  const glow=glowT!==undefined&&t>glowT;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.1+rnd(x)*0.12);ctx.scale(sc,sc);
  ctx.globalAlpha=clamp((t-t0)*8,0,1);
  if(glow){const gp=.6+.4*Math.sin((t-glowT)*9);
    ctx.shadowColor=`rgba(255,42,30,${gp})`;ctx.shadowBlur=34;}
  ctx.fillStyle='rgba(120,10,15,0.30)';rr(-140,-78,280,156,14);ctx.fill();
  ctx.strokeStyle='#FF4A3D';ctx.lineWidth=9;rr(-140,-78,280,156,14);ctx.stroke();
  ctx.strokeStyle='rgba(255,74,61,0.5)';ctx.lineWidth=4;rr(-128,-66,256,132,10);ctx.stroke();
  ctx.font=`900 70px ${SERIF}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.strokeStyle='#10131F';ctx.lineWidth=12;ctx.strokeText(txt,0,4);
  ctx.fillStyle='#FF4A3D';ctx.fillText(txt,0,4);
  ctx.restore();
}

// ---------- scenes ----------
function sceneHook(t){

function sceneReach(t){
  segText([{t:'ネットに上げる',c:'w'},{t:'必要すらない',c:'r'}],{y:640,size:80,t0:22.95,t});
  if(t>25.0)pillBlock(t,25.0,W/2,830,'1人に送るだけ',62,'#FFCF3F','gold');
  if(t>26.45)pillBlock(t,26.45,W/2,975,'画面を見せるだけ',62,'#FFCF3F','gold');
  if(t>27.5)pillBlock(t,27.5,W/2,1120,'それだけで条文にあたる',50,'#FF4A3D','#FF4A3D',true);
  // チャット→矢印→手錠
  const chp=popIn(t,23.4,.25);
  if(chp>0){ctx.save();ctx.globalAlpha=chp;
    ctx.save();ctx.translate(300,1420);ctx.scale(chp,chp);
    ctx.fillStyle='rgba(6,9,22,0.85)';rr(-190,-130,380,260,26);ctx.fill();
    ctx.strokeStyle='#5CB6FF';ctx.lineWidth=5;rr(-190,-130,380,260,26);ctx.stroke();
    ctx.fillStyle='#233052';rr(-160,-96,240,62,26);ctx.fill();
    ctx.fillStyle='#2E6B4F';rr(-80,-18,240,62,26);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    rr(-138,-78,180,22,11);ctx.fill();rr(-58,0,180,22,11);ctx.fill();
    ctx.restore();
    // 矢印
    const ap=clamp((t-25.0)/.78,0,1);
    if(ap>0){const ex=lerp(500,830,easeInOut(ap)),ey=lerp(1400,1430,ap);
      ctx.strokeStyle='#FFCF3F';ctx.lineWidth=12;ctx.lineCap='round';
      ctx.setLineDash([26,18]);ctx.lineDashOffset=-t*60;
      ctx.beginPath();ctx.moveTo(500,1400);ctx.quadraticCurveTo(660,1330,ex,ey);ctx.stroke();
      ctx.setLineDash([]);
      if(ap>=1){drawCuffs(880,1440,1.0,t);}
      else{ctx.save();ctx.translate(ex,ey);
        ctx.fillStyle='#FFCF3F';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-30,-14);ctx.lineTo(-24,12);ctx.closePath();ctx.fill();ctx.restore();}}
    ctx.restore();}
}

const EXCUSES=[
  {tIn:31.40,tX:32.95,txt:'もう出回っていた',reb:'転載も配布だ',tReb:32.98},
  {tIn:34.15,tX:35.70,txt:'撮ったのは自分じゃない',reb:'共有は単独で罪になる',tReb:35.72},
  {tIn:37.70,tX:39.00,txt:'同意はもらった',reb:'撮影の同意≠共有の同意',tReb:39.03,big:1},
];
function sceneExcuse(t){
  megaText([{txt:'全部潰されている',size:96,y:480,fill:'red',rot:-.015}],{t,slam:29.3});
  for(let i=0;i<EXCUSES.length;i++){
    const e=EXCUSES[i];
    if(t<e.tIn)continue;
    const nextIn=i<2?EXCUSES[i+1].tIn:41.6;
    if(t>nextIn+.1)continue;
    // 吹き出し
    let bx=W/2,by=830,brot=0,bal=1;
    if(t>e.tX){const d=clamp((t-e.tX)/.55,0,1);
      by=830+700*easeInQuad(d);brot=.4*d;bal=1-d;}
    const bp=popIn(t,e.tIn,.22);
    if(bal>0&&bp>0){ctx.save();ctx.translate(bx,by);ctx.rotate(brot);ctx.scale(bp,bp);
      ctx.globalAlpha=bal;
      ctx.font=`900 62px ${SANS}`;
      const bw=ctx.measureText(e.txt).width+150;
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(-bw/2+8,-88+10,bw,176,42);ctx.fill();
      ctx.fillStyle='#F2F5FF';rr(-bw/2,-88,bw,176,42);ctx.fill();
      ctx.beginPath();ctx.moveTo(-70,88);ctx.lineTo(-34,146);ctx.lineTo(10,88);ctx.closePath();ctx.fill();
      ctx.fillStyle='#1B2340';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('「'+e.txt+'」',0,2);
      ctx.restore();}
    // ✖
    if(t>e.tX)drawX(t,e.tX,W/2,850,e.big?320:250,nextIn);
    // 反論
    if(t>e.tReb)segText([{t:e.reb,c:'r'}],{y:1120,size:72,t0:e.tReb,t,alpha:t>nextIn?0:1});
  }
}

function scenePenalty(t){
  photoBG('prison',t,{fx:.5,fy:.4,z0:1.02,z1:1.16,t0:41.6,t1:52},'rgba(10,8,20,0.62)','rgba(10,8,20,0.86)','red');
  ctx.font=`500 24px ${SANS}`;ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillText('Photo: Tony Webster / CC BY 2.0',W-24,26);
  // 懲役カウンター
  if(t>41.7){
    const n=Math.min(7,3+Math.floor(clamp((t-41.7)/1.15,0,1)*4.99));
    segText([{t:'懲役',c:'w'}],{y:760,size:72,t0:41.7,t});
    megaText([{txt:`3年 → ${n}年`,size:130,y:910,fill:'gold',rot:-.015}],{t,slam:41.7});
  }
  if(t>43.55){
    const m=Math.min(50,10+Math.floor(clamp((t-43.55)/1.4,0,1)*8.99)*5);
    megaText([{txt:`罰金 10万 → ${m}万ペソ`,size:88,y:1110,fill:'gold',rot:-.012}],{t,slam:43.55});
  }
  // 削除/送信済み
  if(t>45.8){
    pillBlock(t,45.8,330,640,'🗑 削除',46,'#8B90A6','#C9D0E8');
    pillBlock(t,45.95,730,640,'✓ 送信済み',46,'#46E0A0','#46E0A0');
    drawX(t,46.35,330,640,120);
    megaText([{txt:'削除しても遅い',size:126,y:1330,fill:'red',rot:-.02}],{t,slam:45.8});
  }
  if(t>47.4)segText([{t:'送信した時点で、罪は成立している',c:'w'}],{y:1490,size:56,t0:47.45,t});
  // 赤フェード＋エンド
  if(t>49.6){
    const rp=clamp((t-49.6)/1.0,0,1);
    ctx.fillStyle=`rgba(126,10,18,${rp})`;ctx.fillRect(0,0,W,H);
    if(t>50.9){const na=clamp((t-50.9)*2.5,0,1);
      ctx.save();ctx.globalAlpha=na;
      ctx.font=`900 54px ${SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText('※RA9995 反写真・ビデオ盗撮法（2009年）',W/2,920);
      ctx.font=`500 26px ${SANS}`;ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.fillText('Photos: Wikimedia Commons — Red marquis（CC0）/ Tony Webster（CC BY 2.0）',W/2,1010);
      ctx.restore();}
  }
}

// ---------- overlays ----------
const BADGES={hook:{txt:'フィリピンのヤバい法律',col:'#D6203A',flag:1},
  law:{txt:'盗撮・映像禁止法',col:'#FF4A3D'},
  reach:{txt:'拡散しなくても罪',col:'#5CB6FF'},
  excuse:{txt:'言い訳は通らない',col:'#FF4A3D'},
  penalty:{txt:'刑罰',col:'#FFC933'}};
function drawBadge(t,sec,secStart){
  const b=BADGES[sec];if(!b)return;
  const p=clamp((t-secStart)/.35,0,1);
  const y=lerp(-70,150,easeOutBack(p));
  ctx.save();ctx.translate(W/2,y+Math.sin(t*2.1)*4);
  ctx.font=`900 46px ${SANS}`;
  const tw=ctx.measureText(b.txt).width;
  const w=tw+(b.flag?190:120);
  ctx.fillStyle='rgba(5,8,20,0.78)';rr(-w/2,-46,w,92,46);ctx.fill();
  ctx.strokeStyle=b.col;ctx.lineWidth=5;rr(-w/2,-46,w,92,46);ctx.stroke();
  let tx=0;
  if(b.flag){ctx.save();ctx.translate(-w/2+50,-17);drawPHFlagMini(0,0,66);ctx.restore();tx=36;}
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(b.txt,tx,3);ctx.restore();
}
function drawRAChip(t){
  if(t<22.9)return;
  const p=clamp((t-9.0)/.3,0,1);
  ctx.save();ctx.translate(W/2,250);ctx.scale(p,p);
  ctx.font=`900 36px ${SANS}`;
  ctx.fillStyle='rgba(5,8,20,0.7)';rr(-110,-30,220,60,30);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3;rr(-110,-30,220,60,30);ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('RA9995',0,2);ctx.restore();
}
function drawPHFlagMini(x,y,w){
  const h=w*.52;
  ctx.fillStyle=COL.phBlue;ctx.fillRect(x,y,w,h/2);
  ctx.fillStyle=COL.phRed;ctx.fillRect(x,y+h/2,w,h/2);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*.4,y+h/2);ctx.lineTo(x,y+h);ctx.closePath();ctx.fill();
  ctx.fillStyle=COL.phYellow;ctx.beginPath();ctx.arc(x+w*.13,y+h/2,w*.055,0,7);ctx.fill();
}
function drawSubs(t){
  for(const s of TL.subs){
    if(t<s.s||t>s.e+.12)continue;
    const g=ctx.createLinearGradient(0,1440,0,H);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=g;ctx.fillRect(0,1440,W,H-1440);
    const n=s.lines.length;
    const fade=t>s.e?clamp(1-(t-s.e)/.12,0,1):1;
    for(let i=0;i<n;i++){
      const y=n===1?1620:1568+i*104;
      segText(s.lines[i],{y,size:64,t0:s.s+i*.14,t,strokeW:13,alpha:fade});}
  }
}
function drawProgress(t){
  ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(0,0,W,10);
  const w=W*clamp(t/TL.DUR,0,1);
  ctx.fillStyle=goldGrad(0,10);ctx.fillRect(0,0,w,10);
  const gl=ctx.createRadialGradient(w,5,0,w,5,26);
  gl.addColorStop(0,'rgba(255,230,140,0.9)');gl.addColorStop(1,'rgba(255,230,140,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(w,5,26,0,7);ctx.fill();
}
const WIPES=[8.92,22.9,29.1,41.6];
function drawWipes(t){
  for(const ts of WIPES){const d=(t-ts+.11)/.24;
    if(d>0&&d<1){const x=lerp(-W*1.6,W*1.7,easeInOut(d));
      ctx.save();ctx.translate(x,H/2);ctx.rotate(-.35);
      ctx.fillStyle='#FFC933';ctx.fillRect(-260,-1500,320,3000);
      ctx.fillStyle='#fff';ctx.fillRect(90,-1500,150,3000);
      ctx.fillStyle='rgba(214,32,58,0.9)';ctx.fillRect(280,-1500,90,3000);
      ctx.restore();}}
}
function vignetteGrain(t){
  const vg=ctx.createRadialGradient(W/2,H/2,520,W/2,H/2,1400);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const f=Math.floor(t*30);
  ctx.globalAlpha=.05;ctx.fillStyle='#fff';
  for(let i=0;i<110;i++){
    ctx.fillRect(rnd(i*7+f*13)*W,rnd(i*11+f*17)*H,2.2,2.2);}
  ctx.globalAlpha=1;
}

// ---------- main ----------
function currentSection(t){
  for(const s of TL.sections)if(t>=s.s&&t<s.e)return s;
  return TL.sections[TL.sections.length-1];
}
window.renderFrame=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  const sec=currentSection(t);
  const off=shakeOffset(t);
  const z=worldZoom(t);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  ctx.translate(off.x,off.y);
  drawBG(t,sec.id);
  if(sec.id==='hook')sceneHook(t);
  else if(sec.id==='law')sceneLaw(t);
  else if(sec.id==='reach')sceneReach(t);
  else if(sec.id==='excuse')sceneExcuse(t);
  else scenePenalty(t);
  drawBursts(t);
  ctx.restore();
  if(t<49.6){
    drawSubs(t);
    drawBadge(t,sec.id,sec.s);
    drawRAChip(t);
    drawProgress(t);
  }
  drawSpeedlines(t);
  drawFlashes(t);
  drawWipes(t);
  vignetteGrain(t);
  if(t>49.6){ // 赤エンド（オーバーレイ類の上に再描画）
    const rp=clamp((t-49.6)/1.0,0,1);
    ctx.fillStyle=`rgba(126,10,18,${rp*.9})`;ctx.fillRect(0,0,W,H);
    if(t>50.9){const na=clamp((t-50.9)*2.5,0,1);
      ctx.save();ctx.globalAlpha=na;
      ctx.font=`900 52px ${SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText('※RA9995 反写真・ビデオ盗撮法（2009年）',W/2,930);
      ctx.font=`500 26px ${SANS}`;ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.fillText('Photos: Wikimedia Commons — Red marquis（CC0）/ Tony Webster（CC BY 2.0）',W/2,1015);
      ctx.restore();}
  }
  if(t<.25){ctx.fillStyle=`rgba(0,0,0,${1-t/.25})`;ctx.fillRect(0,0,W,H);}
};

// ---------- boot ----------
(async()=>{
  const loads=[
    `900 100px ${SANS}`,`700 60px ${SANS}`,`900 100px ${SERIF}`,`100px ${EMOJI}`,
  ].map(f=>document.fonts.load(f,'盗撮映像禁止売複製共有≠🗑✓🇵🇭'));
  try{await Promise.all(loads);await document.fonts.ready;}catch(e){}
  await Promise.all(Object.entries(window.PHOTOS||{}).map(([k,src])=>new Promise(res=>{
    const im=new Image();im.onload=()=>{IMGS[k]=im;res()};im.onerror=()=>res();im.src=src;})));
  window.renderFrame(0);
  window.READY=true;
})();
</script>
