<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Land Title Short Renderer</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script src="assets/img/photos.js"></script>
<script>
'use strict';
const TL = window.TIMELINE;
const W = TL.W, H = TL.H;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const IMGS = {};

// ---------- utils ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,p)=>a+(b-a)*p;
const fract = x=>x-Math.floor(x);
const rnd = i=>fract(Math.sin(i*127.1+311.7)*43758.5453);
const easeOutQuad = p=>1-(1-p)*(1-p);
const easeInQuad = p=>p*p;
const easeInOut = p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOutCubic = p=>1-Math.pow(1-p,3);
const easeOutQuint = p=>1-Math.pow(1-p,5);
const easeOutBack = (p,s=2.2)=>{const c=s+1;return 1+c*Math.pow(p-1,3)+s*Math.pow(p-1,2);};
const easeOutElastic = p=>p<=0?0:p>=1?1:Math.pow(2,-10*p)*Math.sin((p*10-0.75)*(2*Math.PI/3))+1;
const easeOutBounce = p=>{const n=7.5625,d=2.75;
  if(p<1/d)return n*p*p; if(p<2/d)return n*(p-=1.5/d)*p+.75;
  if(p<2.5/d)return n*(p-=2.25/d)*p+.9375; return n*(p-=2.625/d)*p+.984375;};

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const SANS='"Noto Sans CJK JP"', SERIF='"Noto Serif CJK JP"', EMOJI='"Noto Color Emoji"';
const COL={w:'#FFFFFF',r:'#FF4A3D',g:'#FFCF3F',b:'#5CB6FF',ink:'#10131F',
  phBlue:'#0E4BC3',phRed:'#D6203A',phYellow:'#FCD116'};

function goldGrad(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#FFF3B0');g.addColorStop(.45,'#FFD34D');g.addColorStop(.55,'#F7A928');g.addColorStop(1,'#FFCE45');return g;}

const mCache=new Map();
function chW(font,ch){const k=font+'|'+ch;let v=mCache.get(k);
  if(v===undefined){ctx.font=font;v=ctx.measureText(ch).width;mCache.set(k,v);}return v;}

// ---------- styled segment text ----------
function segText(segs,o){
  const font=`900 ${o.size}px ${o.font||SANS}`;
  const chars=[];
  for(const s of segs)for(const ch of s.t)chars.push({ch,c:s.c});
  let total=0;for(const c of chars)total+=chW(font,c.ch);
  let cx=(o.x!==undefined?o.x:W/2)-total/2;
  const t=o.t,t0=o.t0,st=o.stagger!==undefined?o.stagger:.022,pd=o.popDur||.17;
  ctx.save();ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineCap='round';
  for(let i=0;i<chars.length;i++){
    const c=chars[i],w=chW(font,c.ch);
    let sc=1,al=1;
    if(!o.fixed){
      const p=(t-(t0+i*st))/pd;
      if(p<=0){cx+=w;continue;}
      sc=p>=1?1:easeOutBack(p);al=clamp(p*2.5,0,1);
    }
    if(o.kwBounce!==false&&c.c!=='w'&&c.c!=='k')sc*=1+0.045*Math.sin(t*6.5+i*1.3);
    ctx.save();ctx.translate(cx+w/2,o.y);ctx.scale(sc,sc);
    ctx.globalAlpha=(o.alpha!==undefined?o.alpha:1)*al;
    ctx.font=font;
    ctx.strokeStyle=o.strokeCol||COL.ink;ctx.lineWidth=(o.strokeW!==undefined?o.strokeW:o.size*.18);
    ctx.strokeText(c.ch,0,0);
    if(c.c==='g'){ctx.fillStyle=goldGrad(-o.size*.55,o.size*.55);}
    else ctx.fillStyle=COL[c.c]||c.c||'#fff';
    ctx.fillText(c.ch,0,0);
    ctx.restore();
    cx+=w;
  }
  ctx.restore();
  return total;
}

function popIn(t,t0,dur=.2){const p=(t-t0)/dur;return p<=0?0:p>=1?1:easeOutBack(p);}
function elasticIn(t,t0,dur=.55){const p=(t-t0)/dur;return p<=0?0:easeOutElastic(clamp(p,0,1));}
function outSc(t,tEnd,dur=.16){
  if(t<tEnd)return 1;const p=(t-tEnd)/dur;return p>=1?0:1-easeInQuad(p);}

// ---------- photo helpers ----------
function kbDraw(key,dx,dy,dw,dh,t,o){
  const img=IMGS[key];if(!img)return false;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const p=clamp((t-(o.t0||0))/((o.t1||1)-(o.t0||0)||1),0,1);
  const z=lerp(o.z0||1.05,o.z1||1.2,p);
  const scale=Math.max(dw/iw,dh/ih)*z;
  const sw=dw/scale,sh=dh/scale;
  const fx=o.fx!==undefined?o.fx:.5,fy=o.fy!==undefined?o.fy:.5;
  const sx=clamp(fx*iw-sw/2,0,iw-sw);
  const sy=clamp(fy*ih-sh/2,0,ih-sh);
  ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
  return true;
}
function photoPanel(key,x,y,w,h,t,tIn,o,label,credit){
  const p=popIn(t,tIn,.25);if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.scale(p,p);ctx.rotate(o.rot||0);
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(-w/2+10,-h/2+12,w,h,26);ctx.fill();
  rr(-w/2,-h/2,w,h,26);ctx.save();ctx.clip();
  ctx.translate(-w/2,-h/2);
  kbDraw(key,0,0,w,h,t,o);
  ctx.fillStyle='rgba(11,16,38,0.22)';ctx.fillRect(0,0,w,h);
  const vg=ctx.createLinearGradient(0,h*.55,0,h);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
  if(credit){ctx.font=`500 24px ${SANS}`;ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText(credit,w-16,h-10);}
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=6;rr(-w/2,-h/2,w,h,26);ctx.stroke();
  if(label){ctx.font=`900 40px ${SANS}`;
    const lw=ctx.measureText(label).width+72;
    ctx.fillStyle='rgba(5,8,20,0.85)';rr(-w/2+22,-h/2-28,lw,64,32);ctx.fill();
    ctx.strokeStyle='#FFCF3F';ctx.lineWidth=4;rr(-w/2+22,-h/2-28,lw,64,32);ctx.stroke();
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(label,-w/2+58,-h/2+5);}
  ctx.restore();
}

// ---------- impacts ----------
const IMPACTS=[
  {t:0.25,amp:6,fl:{c:'255,255,255',a:.18}},
  {t:3.57,amp:6,fl:{c:'255,255,255',a:.18}},
  {t:8.05,amp:6,fl:{c:'255,255,255',a:.18}},
  {t:9.42,amp:14,fl:{c:'255,201,51',a:.2}},
  {t:10.8,amp:8},
  {t:12.15,amp:6,fl:{c:'255,255,255',a:.18}},
  {t:12.55,amp:14},
  {t:13.2,amp:20,fl:{c:'255,42,30',a:.15}},
  {t:15.42,amp:24,fl:{c:'255,42,30',a:.32},bu:{x:540,y:1250,cols:['#FF5A4E','#fff'],n:28,sp:900},ln:1},
  {t:18.77,amp:24,fl:{c:'255,42,30',a:.3},bu:{x:540,y:800,cols:['#FF5A4E','#fff'],n:26,sp:850},ln:1},
  {t:20.5,amp:8},
  {t:27.45,amp:6},
  {t:27.92,amp:22,fl:{c:'255,255,255',a:.2},bu:{x:540,y:950,cols:['#F2EFE4','#D9D4C4','#fff'],n:26,sp:800}},
  {t:29.9,amp:14,fl:{c:'255,42,30',a:.14}},
  {t:30.95,amp:14,fl:{c:'255,42,30',a:.14}},
  {t:32.6,amp:16,fl:{c:'255,42,30',a:.18},bu:{x:540,y:720,cols:['#EAF0FF','#9FB0D8','#fff'],n:22,sp:700}},
  {t:35.95,amp:10},
  {t:38.12,amp:22,fl:{c:'255,42,30',a:.3},ln:1},
  {t:40.5,amp:10,fl:{c:'255,201,51',a:.3}},
  {t:43.07,amp:22,fl:{c:'255,42,30',a:.28},ln:1},
  {t:46.2,amp:10,fl:{c:'255,42,30',a:.3}},
  {t:48.6,amp:10},
  {t:49.97,amp:16,fl:{c:'255,201,51',a:.2},conf:1},
  {t:52.47,amp:26,fl:{c:'255,42,30',a:.32},bu:{x:540,y:1330,cols:['#FF5A4E','#fff'],n:30,sp:920},ln:1},
  {t:54.25,amp:6},
  {t:57.32,amp:24,fl:{c:'255,42,30',a:.3},ln:1},
];
function shakeOffset(t){
  let x=0,y=0;
  for(const im of IMPACTS){const d=t-im.t;
    if(d>0&&d<.5){const k=im.amp*Math.pow(1-d/.5,2.2);
      const f=Math.floor(t*60);
      x+=(rnd(f*3.7+im.t*91)-.5)*2*k;y+=(rnd(f*5.3+im.t*57)-.5)*2*k;}}
  return {x,y};
}
function drawFlashes(t){
  for(const im of IMPACTS){if(!im.fl)continue;const d=t-im.t;
    if(d>0&&d<.3){ctx.fillStyle=`rgba(${im.fl.c},${im.fl.a*(1-d/.3)})`;ctx.fillRect(0,0,W,H);}}
}
function drawBursts(t){
  for(const im of IMPACTS){
    if(im.bu){const b=im.bu,d=t-im.t;
      if(d>0&&d<.75){for(let i=0;i<b.n;i++){
        const a=rnd(i*7+im.t*13)*Math.PI*2,sp=b.sp*(0.45+rnd(i*3+1)*0.8);
        const pr=easeOutCubic(clamp(d/.75,0,1));
        const px=b.x+Math.cos(a)*sp*pr,py=b.y+Math.sin(a)*sp*pr*0.85;
        const sz=(4+rnd(i*11)*11)*(1-pr);
        ctx.fillStyle=b.cols[i%b.cols.length];ctx.globalAlpha=1-pr;
        ctx.save();ctx.translate(px,py);ctx.rotate(a+pr*6);
        ctx.fillRect(-sz,-sz*.45,sz*2,sz*.9);ctx.restore();}
        ctx.globalAlpha=1;}}
    if(im.conf){const d=t-im.t;
      if(d>0&&d<1.6){for(let i=0;i<26;i++){
        const x0=rnd(i*13+2)*W,vy=500+rnd(i*17)*420;
        const px=x0+Math.sin(d*4+i)*60,py=-40+vy*d;
        if(py>H+40)continue;
        const cols=['#FFD34D','#FF5A4E','#5CB6FF','#fff','#FCD116'];
        ctx.fillStyle=cols[i%cols.length];ctx.globalAlpha=clamp(1.6-d,0,1)*.9;
        ctx.save();ctx.translate(px,py);ctx.rotate(d*7+i);ctx.fillRect(-9,-6,18,12);ctx.restore();}
        ctx.globalAlpha=1;}}
  }
}
function drawSpeedlines(t){
  for(const im of IMPACTS){if(!im.ln)continue;const d=t-im.t;
    if(d>0&&d<.4){const al=(1-d/.4)*.75;
      ctx.save();ctx.translate(W/2,H/2);
      for(let i=0;i<26;i++){
        const a=rnd(i*31+im.t*7)*Math.PI*2+Math.floor(t*30)*.13;
        const r0=430+rnd(i*5)*180,r1=1250;
        const wdt=(2+rnd(i*9)*9)*al;
        ctx.strokeStyle=`rgba(255,255,255,${al*(0.35+rnd(i)*0.6)})`;
        ctx.lineWidth=wdt;ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);
        ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.stroke();}
      ctx.restore();}}
}

// ---------- backgrounds ----------
function drawBG(t,sec){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(sec==='damasare'){g.addColorStop(0,'#150A12');g.addColorStop(1,'#31101E');}
  else if(sec==='gyakuten'){g.addColorStop(0,'#12081F');g.addColorStop(1,'#2A1040');}
  else if(sec==='punch'){g.addColorStop(0,'#0B0A18');g.addColorStop(1,'#1A1030');}
  else{g.addColorStop(0,'#0B1026');g.addColorStop(1,'#131F49');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gx=W/2+Math.sin(t*.5)*120,gy=760+Math.cos(t*.4)*90;
  const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,900);
  rg.addColorStop(0,'rgba(120,150,255,0.14)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-Math.PI/7);
  const period=240,off=(t*70)%period;
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let x=-1700+off;x<1700;x+=period)ctx.fillRect(x,-1400,110,2800);
  ctx.restore();
  for(let i=0;i<24;i++){
    const spd=26+rnd(i*3)*44;
    const px=rnd(i*7)*W+Math.sin(t*(.5+rnd(i)*0.7)+i)*44;
    const py=(H+140-((t*spd+rnd(i*13)*H)%(H+280)));
    const sz=2.5+rnd(i*11)*6;
    ctx.globalAlpha=.10+rnd(i*5)*.16;ctx.fillStyle=i%3?'#FFFFFF':'#FF5A4E';
    ctx.beginPath();ctx.arc(px,py,sz,0,7);ctx.fill();}
  ctx.globalAlpha=1;
}
function paperGhost(cy,rot){
  ctx.save();ctx.globalAlpha=.07;ctx.translate(W/2,cy);ctx.rotate(rot);
  ctx.fillStyle='#fff';rr(-430,-480,860,960,26);ctx.fill();
  ctx.fillStyle='#000';for(let i=0;i<11;i++)rr(-370,-400+i*82,i%3?700:520,20,10),ctx.fill();
  ctx.restore();
}

// ---------- S1 4カット ----------
function cutNeon(t){ // ①ネオンの店内・グラス2つ
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#160820');g.addColorStop(1,'#2A0F2E');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const neons=[['#FF4FA0',200,180,620],['#4FD8FF',360,340,460],['#FFCF3F',520,260,380]];
  for(let i=0;i<neons.length;i++){
    const[c,y,x0,w]=neons[i];
    ctx.save();ctx.shadowColor=c;ctx.shadowBlur=40;
    ctx.globalAlpha=(.8+.2*Math.sin(t*7+i*2))*(i===1&&Math.sin(t*13)>.92?.25:1);
    ctx.strokeStyle=c;ctx.lineWidth=9;
    rr(x0,y,w,92,46);ctx.stroke();
    // 看板の文字風ダッシュ
    ctx.lineCap='round';ctx.lineWidth=11;
    let dx=x0+46;
    for(let d=0;dx<x0+w-60;d++){
      const dw=26+rnd(i*9+d*3)*44;
      ctx.beginPath();ctx.moveTo(dx,y+46);ctx.lineTo(dx+dw,y+46);ctx.stroke();
      dx+=dw+26;}
    ctx.restore();}
  // ボケ玉
  for(let i=0;i<10;i++){
    ctx.save();ctx.globalAlpha=.18+.1*Math.sin(t*3+i);
    ctx.fillStyle=['#FF4FA0','#4FD8FF','#FFCF3F'][i%3];
    ctx.beginPath();ctx.arc(rnd(i*7)*W,700+rnd(i*13)*500,14+rnd(i*3)*22,0,7);ctx.fill();
    ctx.restore();}
  // カウンター
  ctx.fillStyle='#1A0F22';ctx.fillRect(0,1360,W,560);
  ctx.fillStyle='#2E1A38';ctx.fillRect(0,1330,W,44);
  // グラス2つ（乾杯）
  for(const sd of[-1,1]){
    ctx.save();ctx.translate(W/2+sd*130,1150);ctx.rotate(sd*.16);
    ctx.strokeStyle='rgba(220,235,255,0.9)';ctx.lineWidth=10;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-70,-160);ctx.lineTo(70,-160);ctx.lineTo(20,-20);ctx.lineTo(20,90);ctx.moveTo(-20,-20);ctx.lineTo(-20,90);ctx.moveTo(-54,110);ctx.lineTo(54,110);ctx.moveTo(-20,90);ctx.lineTo(-70,-160);
    ctx.stroke();
    ctx.fillStyle='rgba(255,207,63,0.5)';
    ctx.beginPath();ctx.moveTo(-52,-120);ctx.lineTo(52,-120);ctx.lineTo(14,-24);ctx.lineTo(-14,-24);ctx.closePath();ctx.fill();
    ctx.restore();}
  const cp=.7+.3*Math.sin(t*9);
  ctx.save();ctx.translate(W/2,960);ctx.globalAlpha=cp;
  ctx.strokeStyle='#FFF3B0';ctx.lineWidth=7;ctx.lineCap='round';
  for(let i=0;i<6;i++){const a=i*Math.PI/3+t*.8;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*26,Math.sin(a)*26);
    ctx.lineTo(Math.cos(a)*58,Math.sin(a)*58);ctx.stroke();}
  ctx.restore();
}
function drawHouse(x,y,s,night){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=night?'#232B4E':'#F0E8D8';
  rr(-260,-40,520,320,14);ctx.fill();
  ctx.fillStyle=night?'#161C38':'#C8503C';
  ctx.beginPath();ctx.moveTo(-320,-30);ctx.lineTo(0,-210);ctx.lineTo(320,-30);ctx.closePath();ctx.fill();
  ctx.fillStyle=night?'#0E1328':'#7A4B28';rr(-60,120,120,160,8);ctx.fill();
  for(const wx of[-190,110]){
    ctx.fillStyle=night?'#FFCF3F':'#8FCBE8';rr(wx,30,110,100,8);ctx.fill();
    ctx.strokeStyle=night?'#3A4670':'#fff';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(wx+55,30);ctx.lineTo(wx+55,130);ctx.moveTo(wx,80);ctx.lineTo(wx+110,80);ctx.stroke();}
  ctx.restore();
}
function drawFigure(x,y,s,fem,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=col;
  if(fem){ctx.beginPath();ctx.arc(0,-104,34,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(22,-122,14,0,7);ctx.fill();}
  else{ctx.beginPath();ctx.arc(0,-108,36,0,7);ctx.fill();}
  ctx.beginPath();ctx.moveTo(-46,80);ctx.quadraticCurveTo(-40,-56,0,-62);
  ctx.quadraticCurveTo(40,-56,46,80);ctx.closePath();ctx.fill();
  ctx.restore();
}
function cutHouse(t,two){ // ②家の前に2人 / ④1人だけ
  const g=ctx.createLinearGradient(0,0,0,H);
  if(two){g.addColorStop(0,'#FF9E5E');g.addColorStop(.45,'#E86A8A');g.addColorStop(1,'#4A2B5E');}
  else{g.addColorStop(0,'#0A0E24');g.addColorStop(.5,'#141B3E');g.addColorStop(1,'#0A0E24');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(two){ctx.fillStyle='rgba(255,240,200,0.9)';
    ctx.beginPath();ctx.arc(840,420,90,0,7);ctx.fill();}
  else{ctx.fillStyle='rgba(240,244,255,0.9)';
    ctx.beginPath();ctx.arc(840,380,70,0,7);ctx.fill();
    ctx.fillStyle='#0A0E24';ctx.beginPath();ctx.arc(870,360,62,0,7);ctx.fill();
    for(let i=0;i<24;i++){ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillRect(rnd(i*3)*W,rnd(i*7)*700,3,3);}}
  ctx.fillStyle=two?'#3E2B22':'#0C1020';ctx.fillRect(0,1430,W,490);
  drawHouse(W/2,1000,1.15,!two);
  if(two){
    drawFigure(400,1420,1.15,false,'#2A1E2E');
    drawFigure(560,1428,1.05,true,'#3A2440');
  }else{
    drawFigure(480,1428,1.15,false,'#060910');
  }
}
function cutContract(t){ // ③契約書に判子
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241A10');g.addColorStop(1,'#0F0A06');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,1060);ctx.rotate(-.03);
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(-372,-452,760,920,18);ctx.fill();
  ctx.fillStyle='#F5F0E2';rr(-380,-460,760,920,18);ctx.fill();
  ctx.fillStyle='#2C3350';rr(-380,-460,760,110,18);ctx.fill();
  ctx.font=`900 52px ${SERIF}`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('土地売買契約書',0,-406);
  ctx.fillStyle='#8B90A6';
  for(let i=0;i<6;i++){rr(-320,-290+i*70,i%2?520:640,18,9);ctx.fill();}
  ctx.font=`900 44px ${SANS}`;ctx.fillStyle='#3A415E';ctx.textAlign='left';
  ctx.fillText('買主名義：',-320,190);
  ctx.strokeStyle='#3A415E';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-90,215);ctx.lineTo(330,215);ctx.stroke();
  ctx.font=`900 56px ${SERIF}`;ctx.fillStyle='#1B2340';

// ---------- big blocks ----------
function megaText(lines,o){
  ctx.save();
  const bob=o.bob!==false;
  const baseX=o.x!==undefined?o.x:W/2;
  for(const L of lines){
    const p=o.pop!==undefined?o.pop:1;if(p<=0)continue;
    ctx.save();
    const byy=bob?Math.sin(o.t*2.3+L.y)*5:0;
    ctx.translate(baseX,L.y+byy);
    ctx.rotate((L.rot||0)+(bob?Math.sin(o.t*1.6+L.y*.7)*.012:0));
    let sx=p,sy=p;
    if(o.slam!==undefined){const sp=(o.t-o.slam)/(o.slamDur||.14);
      if(sp<0){ctx.restore();continue;}
      const k=sp>=1?1:easeOutQuint(clamp(sp,0,1));sx=sy=2.7-1.7*k;
      ctx.globalAlpha=clamp(sp*3,0,1);}
    ctx.scale(sx,sy);
    ctx.font=`900 ${L.size}px ${L.font||SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle=COL.ink;ctx.lineWidth=L.size*.24;ctx.strokeText(L.txt,0,0);
    ctx.strokeStyle='#fff';ctx.lineWidth=L.size*.09;
    if(L.fill!=='white')ctx.strokeText(L.txt,0,0);
    if(L.fill==='red')ctx.fillStyle='#FF3B2F';
    else if(L.fill==='gold')ctx.fillStyle=goldGrad(-L.size*.55,L.size*.55);
    else ctx.fillStyle='#fff';
    ctx.fillText(L.txt,0,0);
    ctx.restore();}
  ctx.restore();
}
function pillBlock(t,t0,x,y,txt,size,border,fill){

function drawWipes(t){
  for(const ts of WIPES){const d=(t-ts+.11)/.24;
    if(d>0&&d<1){const x=lerp(-W*1.6,W*1.7,easeInOut(d));
      ctx.save();ctx.translate(x,H/2);ctx.rotate(-.35);
      ctx.fillStyle='#FFC933';ctx.fillRect(-260,-1500,320,3000);
      ctx.fillStyle='#fff';ctx.fillRect(90,-1500,150,3000);
      ctx.fillStyle='rgba(214,32,58,0.9)';ctx.fillRect(280,-1500,90,3000);
      ctx.restore();}}
}
function vignetteGrain(t){
  const vg=ctx.createRadialGradient(W/2,H/2,520,W/2,H/2,1400);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const f=Math.floor(t*30);
  ctx.globalAlpha=.05;ctx.fillStyle='#fff';
  for(let i=0;i<110;i++){
    ctx.fillRect(rnd(i*7+f*13)*W,rnd(i*11+f*17)*H,2.2,2.2);}
  ctx.globalAlpha=1;
}

// ---------- main ----------
function currentSection(t){
  for(const s of TL.sections)if(t>=s.s&&t<s.e)return s;
  return TL.sections[TL.sections.length-1];
}
window.renderFrame=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  const sec=currentSection(t);
  const off=shakeOffset(t);
  ctx.save();ctx.translate(off.x,off.y);
  if(sec.id!=='story')drawBG(t,sec.id);
  if(sec.id==='story')sceneStory(t);
  else if(sec.id==='case')sceneCase(t);
  else if(sec.id==='damasare')sceneDamasare(t);
  else if(sec.id==='gyakuten')sceneGyakuten(t);
  else scenePunch(t);
  drawBursts(t);
  ctx.restore();
  if(t<58.2){
    drawSubs(t);
    drawBadge(t,sec.id,sec.s);
    drawCaseChip(t);
    drawProgress(t);
  }
  drawSpeedlines(t);
  drawFlashes(t);
  drawWipes(t);
  vignetteGrain(t);
  if(t>58.2){
    const rp=clamp((t-58.2)/1.0,0,1);
    ctx.fillStyle=`rgba(126,10,18,${rp*.92})`;ctx.fillRect(0,0,W,H);
    if(t>59.1){const na=clamp((t-59.1)*2.5,0,1);
      ctx.save();ctx.globalAlpha=na;
      ctx.font=`900 44px ${SANS}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText('※Frenzel v. Catito（G.R. No. 143958 / 2003年）',W/2,880);
      ctx.font=`500 30px ${SANS}`;ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillText('アンチダミー法＝Commonwealth Act 108',W/2,960);
      ctx.font=`500 26px ${SANS}`;ctx.fillStyle='rgba(255,255,255,0.65)';
      ctx.fillText('個別のケースは現地の弁護士にご確認ください',W/2,1030);
      ctx.fillText('Photo: Patrickroque01 / CC BY-SA 4.0（Wikimedia Commons）',W/2,1090);
      ctx.restore();}
  }
  if(t<.25){ctx.fillStyle=`rgba(0,0,0,${1-t/.25})`;ctx.fillRect(0,0,W,H);}
};

// ---------- boot ----------
(async()=>{
  const loads=[
    `900 100px ${SANS}`,`700 60px ${SANS}`,`900 100px ${SERIF}`,`100px ${EMOJI}`,
  ].map(f=>document.fonts.load(f,'名義彼女土地登記簿印訴状💍✈️🇵🇭'));
  try{await Promise.all(loads);await document.fonts.ready;}catch(e){}
  await Promise.all(Object.entries(window.PHOTOS||{}).map(([k,src])=>new Promise(res=>{
    const im=new Image();im.onload=()=>{IMGS[k]=im;res()};im.onerror=()=>res();im.src=src;})));
  window.renderFrame(0);
  window.READY=true;
})();
</script>
